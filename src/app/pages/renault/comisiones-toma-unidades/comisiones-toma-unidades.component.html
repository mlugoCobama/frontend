<app-card-top 
[title] = "'Comsiones por Toma de Unidades'"
[hasButtons] = "true"
[showBtnNuevo] = "true"
[showBtnEditar] = "false"
[showBtnEliminar] = "false"
(nuevo) = "openModalNuevo()"

></app-card-top>


<app-filtro-comsiones-generico
  [config]="configFiltro"
  [estadoOpciones]="misEstados"
  [hasData]="hayDatos"
  [downloading]="descargando"
  [searching]="buscando"
  (buscar)="buscarDatos($event)"
  (descargar)="onDescargar($event)"
  (formValidChange)="formularioValido = $event"
  (resetted)="onReset()"

  >
</app-filtro-comsiones-generico>

<app-tabla-generica
  [data]="data"
  [columnas]="columnasVendedor"
  [isLoad]="isLoad"
  [mostrarSelect]="false"
  placeholderSelect="Seleccione una agencia"
  [mostrarCheck]="false"
  (itemSeleccionado)="onItemSeleccionado($event)"
  [acciones]="accionesTabla"

/>
