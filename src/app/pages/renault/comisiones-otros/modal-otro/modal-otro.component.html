<div class="modal-header">
  <h5 class="modal-title">
    {{ data ? 'Agregar otros ingreso' : 'Agregar otros ingreso' }}
  </h5>
  <button type="button" class="btn-close" (click)="cerrarModal()"></button>
</div>

<div class="modal-body">
  <!-- <app-select-agencia-vendedor #formSelectAgencia></app-select-agencia-vendedor> -->
  <app-add-otro-form #formOtrasComisiones></app-add-otro-form>

</div>

<div class="modal-footer">

   <button class="btn btn-secondary btn-sm" (click)="cerrarModal()">
    Cancelar
  </button>

  <button class="btn btn-warning btn-sm"
          [disabled]="loading"
          (click)="guardar()">

    <span *ngIf="!loading">Guardar</span>
    <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>

  </button>

</div>
