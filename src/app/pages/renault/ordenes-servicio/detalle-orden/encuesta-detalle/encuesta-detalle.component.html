<div *ngIf="encuesta; else sinEncuesta">

    <div

             d-flex justify-content-between align-items-center flex-wrap gap-2">

      <div>
        <h5 class="mb-1 fw-bold">
          <i class="fas fa-clipboard-check me-2 text-warning"></i>
          Encuesta de satisfacción
        </h5>
      </div>

      <div class="text-end">
        <div class="fw-semibold">
          {{ encuesta.fecha | date:'dd/MM/yyyy HH:mm' }}
        </div>
      </div>

    </div>

    <div class="card-body">

      <!-- RESPUESTAS -->
      <div
        *ngFor="let respuesta of encuesta.repuestas"
        class="card rounded-4 shadow-sm mb-3"
        [ngClass]="getClaseCard(respuesta.puntuacion)">

        <div class="card-body">

          <div
            class="d-flex justify-content-between
                   align-items-start gap-3">

            <div class="flex-grow-1">

              <div class="fw-semibold text-dark mb-2">
                {{ respuesta.pregunta.texto }}
              </div>

              <div
                *ngIf="respuesta.motivo"
                class="alert alert-light border rounded-3 mb-0">

                <div class="small text-muted fw-semibold mb-1">
                  <i class="fas fa-comment-alt me-1"></i>
                  Motivo
                </div>

                <div>
                  {{ respuesta.motivo }}
                </div>

              </div>

              <div
                *ngIf="!respuesta.motivo && respuesta.puntuacion < 5"
                class="text-muted small fst-italic">

                El cliente no proporcionó un motivo.

              </div>

            </div>

            <div class="text-center flex-shrink-0">

              <span
                class="badge rounded-pill fs-6 px-3 py-2"
                [ngClass]="getClasePuntuacion(respuesta.puntuacion)">

                {{ respuesta.puntuacion }} / 5  <i class="fas fa-star ms-1"></i>

              </span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<ng-template #sinEncuesta>
<div class="card shadow-sm rounded-4 text-center text-muted">
  <div class="card-body fw-semibold">

    <i class="fas fa-clipboard-list fs-3 mb-2 d-block"></i>

    Esta cita todavía no cuenta con una encuesta registrada.
  </div>
</div>

</ng-template>
