<div class="card shadow-sm rounded-4 h-100 border-0">
  <div class="card-body d-flex flex-column justify-content-between p-3">

    <div>
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold m-0 text-dark">{{ title }}</h6>

        <!-- Badges de estado -->
        <span *ngIf="isCompleted" class="badge bg-success rounded-pill fw-semibold font-size-11">
          <i class="fas fa-check-circle me-1"></i> CONCLUIDO
        </span>
        <span *ngIf="isActive && !isCompleted" class="badge bg-warning text-dark rounded-pill fw-semibold font-size-11">
          <i class="fas fa-spinner fa-spin me-1"></i> EN PROCESO
        </span>
      </div>

      <p class="small text-muted mb-2" *ngIf="description">{{ description }}</p>

      <!-- Bloque para mostrar Observaciones si ya finalizó -->
      <div *ngIf="isCompleted" class="p-2 bg-white rounded-3 border border-success border-opacity-25 mt-2">
        <span class="fw-bold text-success d-block mb-1">
          <i class="fas fa-comment-dots me-1"></i> Observaciones:
        </span>
        <span class="text-secondary d-block italic fs-7 fw-semibold">
          {{ observaciones || 'Sin observaciones' }}
        </span>
      </div>
    </div>

    <!-- Botón de acción (Deshabilitado si está completado) -->
    <div class="mt-3">
      <button
        *ngIf="!isCompleted"
        type="button"
        class="btn w-100 btn-sm rounded-3 fw-bold shadow-sm rounded-pill"
        [ngClass]="isActive ? 'btn-danger' : 'btn-warning text-dark'"
        [disabled]="isLoading"
        (click)="toggleAction()">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
        <i *ngIf="!isLoading" [class]="isActive ? 'fas fa-stop me-1' : 'fas fa-play me-1'"></i>
        {{ isActive ? stopLabel : startLabel }}
      </button>

      <button *ngIf="isCompleted" type="button" class="btn btn-sm btn-outline-secondary w-100 rounded-pill" disabled>
        <i class="fas fa-lock me-1"></i> Proceso Finalizado
      </button>
    </div>

  </div>
</div>
