
<app-card-top 
[title] = "'Comsiones de NR Finance'"
[hasButtons] = "true"
[showBtnNuevo] = "!filaSeleccionada"
[showBtnEditar] = "filaSeleccionada"
[showBtnEliminar] = "filaSeleccionada"
(nuevo) = "openModalNuevo()"
(actualizar) = "openModalActualizar()"
(eliminar) = "confirmarDelete()"
></app-card-top>

<!-- padre.component.html -->
<app-filtro-comsiones-generico
  [config]="configFiltro"
  [estadoOpciones]="misEstados"
  [hasData]="hayDatos"
  [downloading]="descargando"
  [searching]="buscando"
  (buscar)="buscarDatos($event)"
  (descargar)="onDescargar($event)"
  (formValidChange)="formularioValido = $event"
  (resetted)="onReset()">
</app-filtro-comsiones-generico>

<!-- componente.html -->
<app-tabla-generica
  [data]="data"
  [columnas]="columnasVendedor"
  [isLoad]="isLoad"
  [mostrarSelect]="false"
  placeholderSelect="Seleccione una agencia"
  (itemSeleccionado)="onItemSeleccionado($event)"
  [mostrarCheck]="false"
  [acciones]="accionesTabla"
  (itemSeleccionado)="onItemSeleccionado($event)"
  (itemsSeleccionados)="onItemsSeleccionados($event)"
/>
