<div class="modal-header">
  <h5 class="modal-title">
    {{ data ? 'Editar Financiamiento' : 'Nuevo Financiamiento' }}
  </h5>
  <button type="button" class="btn-close" (click)="cerrarModal()"></button>
</div>

<div class="modal-body">
  <app-select-agencia-vendedor #formSelectAgencia [empresaActiva]="empresaActiva"></app-select-agencia-vendedor>
  <app-financiamiento-form #formFinancimiento [vendedores]="vendedores" [tipoFinanciamiento]="'nrfinance'"
   (vendedorAgencia)="actualizarSelectsVendedorAgencia($event)"></app-financiamiento-form>

</div>

<div class="modal-footer">

   <button class="btn btn-secondary btn-sm" (click)="cerrarModal()">
    Cancelar
  </button>

  <button class="btn btn-info btn-sm"
          [disabled]="loading"
          (click)="guardar()">

    <span *ngIf="!loading"><i class="fas fa-save"></i> Guardar</span>
    <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>

  </button>

</div>
