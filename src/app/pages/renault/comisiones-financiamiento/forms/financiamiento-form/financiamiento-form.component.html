<!-- financiamiento-form.component.html -->

<form [formGroup]="form">
    <div class="row">
         <!-- No Contrato -->
      <div class="mb-2 col-lg-6">
        <label class="form-label">No. Contrato</label>
        <input type="text" class="form-control form-control-sm"
               placeholder="No. Contrato" formControlName="no_contrato">
        <div class="text-danger small"
             *ngIf="form.get('no_contrato')?.touched && form.get('no_contrato')?.invalid">
          Campo requerido
        </div>
      </div>

      <!-- Factura -->
      <div class="mb-2 col-lg-6">
        <label class="form-label">Número de Factura</label>
        <input type="text" class="form-control form-control-sm"
               placeholder="Ingresa la factura para ver los datos de venta"
               formControlName="numero_factura">
              <div class="text-danger small"
             *ngIf="form.get('numero_factura')?.touched && form.get('numero_factura')?.invalid">
          Campo requerido
        </div>
      </div>
      <!-- datos venta -->
      <div class=" mb-2 col-lg-4">
      <label class="form-label">Cliente</label>
      <input 
        type="text" 
        class="form-control form-control-sm bg-light" 
        formControlName="razon_social"
        readonly>
    </div>

    <div class=" mb-2 col-lg-5">
      <label class="form-label">Unidad</label>
      <input 
        type="text" 
        class="form-control form-control-sm bg-light" 
        formControlName="descripcion"
        readonly>
    </div>

    <div class="mb-2 col-lg-3">
      <label class="form-label">Serie</label>
      <input 
        type="text" 
        class="form-control form-control-sm bg-light" 
        formControlName="serie"
        readonly>
    </div>

    <!-- Fecha -->
      <div class="mb-2 col-lg-4">
        <label class="form-label">Fecha Desembolso</label>
        <input type="date" class="form-control form-control-sm"
               formControlName="fecha_desembolso">
              <div class="text-danger small"
             *ngIf="form.get('fecha_desembolso')?.touched && form.get('fecha_desembolso')?.invalid">
          Campo requerido
        </div>
      </div>
   

      <!-- Monto -->
      <div class="mb-2 col-lg-4">
        <label class="form-label">Monto a Financiar</label>
        <input mask="separator" thousandSeparator=","  type="text" placeholder="Monto a Financiar" prefix= "$ " class="form-control form-control-sm"
               formControlName="monto_financiar">
        <div class="text-danger small"
             *ngIf="form.get('monto_financiar')?.touched && form.get('monto_financiar')?.invalid">
          Campo requerido
        </div>               
      </div>

            <div class="mb-2 col-lg-4">
        <label class="form-label">Kit de Seguridad</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="kit_seguridad">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Sat Finder</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="sat_finder">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Garantía Exten.</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="garantia_extendida">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Seguro VF3</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="seguro_vf3">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Accesorios Adicionales</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="accesorios_adicionales">
      </div>

      <!-- Incentivo -->
      <div class="mb-2 col-lg-6">
        <label class="form-label">Incentivo Dealer</label>
        <input mask="separator" thousandSeparator=","  type="text" placeholder="Incentivo Dealer" prefix= "$ "  class="form-control form-control-sm"
               formControlName="incentivo_dealer">
        <div class="text-danger small"
             *ngIf="form.get('incentivo_dealer')?.touched && form.get('incentivo_dealer')?.invalid">
          Campo requerido
        </div>
      </div>

      <!-- % Asesor -->
      <div class="mb-2 col-lg-6">
        <label class="form-label">Porcentaje Asesor</label>
        <input type="number" mask="separator" thousandSeparator=","  type="text" placeholder="% Asesor" suffix="%" 
               class="form-control form-control-sm"
               formControlName="porcentaje_asesor">
        <div class="text-danger small"
             *ngIf="form.get('porcentaje_asesor')?.touched && form.get('porcentaje_asesor')?.invalid">
          Campo requerido
        </div>
      </div>

      <!-- Comisión -->
      <div class="mb-2">
        <label class="form-label">Comisión (calculada)</label>
        <input mask="separator" thousandSeparator=","  type="text" placeholder="Comisión (calculada)" prefix= "$" class="form-control form-control-sm bg-light"
               formControlName="comision_asesor_pesos" readonly>
      </div>


      
      <!-- ====== COMISIONES ====== -->
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Comisión Mantenimiento</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="comision_mantenimiento">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Comisión Garantía Exten.</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="comision_garantia_extendida">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Comisión UDI</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="comision_udi">
      </div>
      
      <div class="mb-2 col-lg-3">
        <label class="form-label">Comisión VF3</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="comision_vf3">
      </div>
      <div class="mb-2">
        <label class="form-label">Total de subsidios x desembolso</label>
        <input mask="separator" thousandSeparator="," type="text" prefix="$ " class="form-control form-control-sm"
          formControlName="sub_x_des">
      </div>
      
      <div class="mb-2">
        <div class="mb-3">
          <label for="exampleFormControlTextarea1" class="form-label">Observaciones</label>
          <textarea formControlName="observaciones" class="form-control" rows="3"></textarea>
        </div>
      </div>



      <!-- Archivo -->
      <div class="mb-3">
        <label class="form-label">Archivo</label>
        <input type="file"
              formControlName="archivo"
                class="form-control form-control-sm"
                (change)="onFileChange($event)">
        </div>
        <div class="text-danger small"
             *ngIf="form.get('archivo')?.touched && form.get('archivo')?.invalid">
          Campo requerido
        </div>
    </div>
     

    </form>
