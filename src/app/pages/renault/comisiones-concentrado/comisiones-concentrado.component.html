<app-card-top 
[title] = "'Concentrado de comisiones'"
></app-card-top>
<app-filtro-comsiones-generico
  [config]="configFiltro"
  [hasData]="hayDatos"
  (buscar)="buscarDatos($event)">
</app-filtro-comsiones-generico>

<div class="row">
    <div class="col">
        <app-kpi-card-generico
        title="Nuevos"
        [kpi]="totales?.nuevos || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
     <div class="col">
        <app-kpi-card-generico
        title="Seminuevos"
        [kpi]="totales?.seminuevos || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
     <div class="col">
        <app-kpi-card-generico
        title="Financiamientos"
        [kpi]="totales?.financiamiento || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
     <div class="col">
        <app-kpi-card-generico
        title="Seguros"
        [kpi]="totales?.seguros || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
    <div class="col">
        <app-kpi-card-generico
        title="Accesorios"
        [kpi]="totales?.accesorios || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
    <div class="col">
        <app-kpi-card-generico
        title="T. de unidades"
        [kpi]="totales?.toma_unidades || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
    <div class="col">
        <app-kpi-card-generico
        title="TOTAL"
        [kpi]="totales?.total || 0"
        description="Pago de comisiones"
        colorClass="text-primary">
        </app-kpi-card-generico>
    </div>
    
</div>

<app-tabla-generica
  [data]="data"
  [columnas]="columnasVendedor"
  [isLoad]="isLoad"
  [mostrarSelect]="false"

/>
