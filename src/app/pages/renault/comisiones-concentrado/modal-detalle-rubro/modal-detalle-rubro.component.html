<div class="modal-header">
  <h5 class="modal-title">
   <strong> {{ rubro.replaceAll("_", " ") | titlecase }} </strong> - {{nroVendedor}} {{nombreVendedor | titlecase}}

  </h5>
  <button type="button" class="btn-close" (click)="cerrarModal()"></button>
</div>

<div class="modal-body p-0 m-0">
  <div class="d-flex justify-content-between align-items-center alert alert-primary p-1 mt-2 mb-0 mx-3">
    <h5 class="px-2 m-0"> <strong> Comisiones autorizadas </strong></h5>
    <h5 class="px-2 m-0"><strong>{{ totalAutorizado || 0 | currency }}</strong></h5>
   </div>
  
    <app-tabla-generica
        [data]="autorizadas"
        [columnas]="columnasVendedor"
        [isLoad]="isLoad"
        [mostrarSelect]="false"
        [mostrarCheck]="false"
        [acciones]="accionesTabla"
    /> 
   <hr>
   <div class="d-flex justify-content-between align-items-center alert alert-warning p-1 mb-0 mx-3">
    <h5 class="px-2 m-0"><strong>Comisiones pendientes</strong></h5>
    <h5 class="px-2 m-0"><strong>{{ totalPendiente || 0 | currency }}</strong></h5>
   </div>
   <app-tabla-generica
        [data]="pendientes"
        [columnas]="columnasVendedor"
        [isLoad]="isLoad"
        [mostrarSelect]="false"
        [mostrarCheck]="false"
        [acciones]="accionesTabla"
    />
     
</div>

<div class="d-flex justify-content-end align-items-center gap-2 m-0 p-2">

   <button class="btn btn-secondary btn-sm" (click)="cerrarModal()">
    Cancelar
  </button>
  <!-- <button class="btn btn-primary btn-sm" (click)="recalcular()">
    Recalcular
  </button> -->
</div>
