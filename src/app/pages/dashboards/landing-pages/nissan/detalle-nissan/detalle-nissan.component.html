<div class="row">
  <div class="col-12">
    <div
      class="page-title-box d-flex align-items-center justify-content-between"
    >
      <div>
        <a [routerLink]="['../../nissan']" class="btn btn-primary btn-sm">
          <i class="bx bx-arrow-back"></i> Atras</a
        >
        <br />
        <h4 class="mb-0 font-size-18 pt-2">Nissan - {{titulo}} / {{nombreMes}} {{ anioSeleccionado }}</h4>
      </div>

      <div class="page-title-right">
        <ol class="breadcrumb m-0">
          <ng-container>
            <li class="breadcrumb-item">
              <a [routerLink]="['../../energeticos']">Home</a>
            </li>
            <li class="breadcrumb-item">
              <a href="javascript: void(0);">Detalle {{ titulo }}</a>
            </li>

            <li class="breadcrumb-item active">Nissan</li>
          </ng-container>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center" *ngIf="isLoad">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div class="row mb-3" *ngIf="!isLoad">
  <div class="col-xl-12">
    <div class="row">
      <div class="col-sm-6">
        <div class="row">
          <div class="col">
            <select
              class="form-select form-select-sm"
              (change)="onChange('selectMes', $event.target.value)"
            >
              <option value="00" selected disabled>Selecciona un mes</option>
              <option
                value="{{ mes.mes }}"
                [disabled]="filtrarMeses(mes.mes)"
                *ngFor="let mes of meses"
                [selected]="mesSeleccionado === mes.mes"
              >
                {{ mes.nombre }}
              </option>
            </select>
          </div>
          <div class="col">
            <select
              class="form-select form-select-sm"
              (change)="onChange('selectAnio', $event.target.value)"
              [value]="anioSeleccionado"
            >
              <option selected disabled>Selecciona un año</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
            </select>
          </div>
          <div class="col">
            <button
              type="button"
              class="btn btn-sm btn-primary"
              (click)="filtrarInfo()"
            >
              Filtrar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row" *ngIf ="concepto != 'ant_inv_nuevo' && concepto != 'ant_inv_semi'">
  <div
    [ngClass]="conceptos.length === 1 ? 'col-xl-12' : 'col-xl-6'"
    *ngFor="let item of conceptos"
  >
    <div class="row mb-4" *ngIf="!isLoad">
      <div class="col-xl-12">
        <div class="row">
          <div class="col-sm-12">
            <app-anual [concepto]="item"></app-anual>
          </div>
        </div>
      </div>
    </div>

    <div class="row" *ngIf="!isLoad">
      <div [ngClass]="conceptos.length === 1 ? 'col-xl-6' : 'col-xl-12'">
        <div class="row">
          <div class="col-sm-12">
            <app-tabla [tipo]="tipo" [concepto]="item"></app-tabla>
          </div>
        </div>
      </div>
      <div [ngClass]="conceptos.length === 1 ? 'col-xl-6' : 'col-xl-12'">
        <div class="row">
          <div class="col-sm-12">
            <app-porcentajes-graficas
              [concepto]="item"
            ></app-porcentajes-graficas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="concepto === 'ant_inv_nuevo' || concepto === 'ant_inv_semi' ">
<div class="row" *ngFor="let item of agencias">
    <div class="col-xl-6">
        <app-ant-inventario
            [dataMes]="dataMesActual" 
            [dataAntInventario] = "dataAntInventario"
            filtro = {{item}}
            concepto="ant_inv_nuevo"

        ></app-ant-inventario>
    </div>
    <div class="col-xl-6">
        <app-ant-inventario
            [dataMes]="dataMesActual"
            [dataAntInventario] = "dataAntInventario"  
            tipo = "nissan-detalle"
            filtro = {{item}}
            concepto="ant_inv_semi"
        ></app-ant-inventario>
    </div>
</div>
</div>
