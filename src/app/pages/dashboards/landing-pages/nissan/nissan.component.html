<div class="row">
    <div class="col-12">
        <div class="page-title-box d-flex align-items-center justify-content-between">
            <h4 class="mb-0 font-size-18">{{nombreMes}} {{anioActual}}</h4>
            <div class="page-title-right ">
                <ol class="breadcrumb m-0 ">
                    <ng-container>
                        <li class="breadcrumb-item"><a href="javascript: void(0);">Landing Page</a>
                        </li>
                        <li class="breadcrumb-item active">Nissan {{nombreMes}} {{anioActual}} </li>
                    </ng-container>
                </ol>
            </div>
        </div>
    </div>
</div>

<div class="d-flex justify-content-center" *ngIf="isLoad">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
<!-- Unidades vendidas  -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-12">
        <div class="row">
            <div class="col-sm-4">
                <app-totales-utilidad-grafica
                    [dataMes]="dataMesActual" 
                    [dataMesAnterior]="dataMesAnterior"
                    tipo = "nissan-detalle"
                    color = "#f00a2c"
                    concepto="nuevos"                    
                    [totalAnio]="dataTotalAnio"
                    [totalAnioAnt]="dataTotalAnioAnt"
                ></app-totales-utilidad-grafica>
            </div>
            <div class="col-sm-4">
                <app-totales-utilidad-grafica
                    [dataMes]="dataMesActual" 
                    [dataMesAnterior]="dataMesAnterior"
                    tipo = "nissan-detalle"
                    color = "#f00a2c"
                    concepto="seminuevos"
                    [totalAnio]="dataTotalAnio"
                    [totalAnioAnt]="dataTotalAnioAnt"
                ></app-totales-utilidad-grafica>
            </div>
            <div class="col-sm-4">
                <app-totales-utilidad-grafica
                    [dataMes]="dataMesActual" 
                    [dataMesAnterior]="dataMesAnterior"
                    tipo = "nissan-detalle"
                    color = "#f00a2c"
                    concepto="flotillas"
                    [totalAnio]="dataTotalAnio"
                    [totalAnioAnt]="dataTotalAnioAnt"
                ></app-totales-utilidad-grafica>
            </div>
        </div>

    </div>
</div>
<!-- Ordenes de servicio -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-12">
        <div class="row">
            <div class="col-sm-6">
                <app-totales-utilidad-grafica
                    [dataMes]="dataMesActual" 
                    [dataMesAnterior]="dataMesAnterior"
                    tipo = "nissan-detalle"
                    color = "#f00a2c"
                    concepto="servicio"
                    [totalAnio]="dataTotalAnio"
                    [totalAnioAnt]="dataTotalAnioAnt"
                ></app-totales-utilidad-grafica>
            </div>
            <div class="col-sm-6">
                <app-totales-utilidad-grafica
                    [dataMes]="dataMesActual" 
                    [dataMesAnterior]="dataMesAnterior"
                    tipo = "nissan-detalle"
                    color = "#f00a2c"
                    concepto="hyp"
                    [totalAnio]="dataTotalAnio"
                    [totalAnioAnt]="dataTotalAnioAnt"
                ></app-totales-utilidad-grafica>
            </div>
        </div>
    </div>
</div>
<!-- Ventas de post venta, Inventarios -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-6">
        <app-totales-porcentaje-grafica 
            [dataMes]="dataMesActual"
            [dataMesAnterior]="dataMesAnterior" 
            tipo = "nissan-detalle"
            concepto="ventas_postventa"
        ></app-totales-porcentaje-grafica>
    </div>
    <div class="col-xl-6">
        <app-totales-porcentaje-grafica 
            [dataMes]="dataMesActual"
            [dataMesAnterior]="dataMesAnterior" 
            tipo = "nissan-detalle" 
            concepto="inventarios"
        ></app-totales-porcentaje-grafica>
    </div>
</div>
<!-- PERSONAL Y GASTOS -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-6">
        <app-totales-porcentaje-grafica
            [dataMes]="dataMesActual"
            [dataMesAnterior]="dataMesAnterior" 
            tipo = "nissan-detalle" 
            concepto="personal"
        ></app-totales-porcentaje-grafica>
    </div>
    <div class="col-xl-6">
        <app-grafica-donut 
            [dataMes]="dataMesActual"
            [dataMesAnterior]="dataMesAnterior" 
            tipo = "nissan-detalle" 
            color = "#f00a2c"
            concepto="gasto"
        ></app-grafica-donut>
    </div>
</div>
<!-- UNO -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-12">
        <app-totales-grafica 
            [dataMes]="dataMesActual" 
            [dataMesAnterior]="dataMesAnterior" 
            tipo = "nissan-detalle"
            color = "#f00a2c"
            concepto="uno"
            [totalAnio]="dataTotalAnio"
            [totalAnioAnt]="dataTotalAnioAnt"
        ></app-totales-grafica>
    </div>
</div>
<!-- UTILIDAD AREA Y OBJETIVOS -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-6">
        <app-totales-porcentaje-grafica 
             [dataMes]="dataMesActual"
            [dataMesAnterior]="dataMesAnterior"
            tipo = "nissan-detalle"
            concepto="utilidad_area"
        ></app-totales-porcentaje-grafica>
    </div>
    <div class="col-xl-6">
        <app-barras-horizontales-metas 
            [dataMes]="dataMesActual" 
            [dataMesAnterior]="dataMesAnterior"
            tipo = "nissan-detalle" 
            concepto="objetivos"
        ></app-barras-horizontales-metas>
    </div>
</div>
<!-- PRESTAMOS NRF Y PLAN PISO -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-6">
        <app-card-prestamos
            concepto = "nrf"
            [dataMes]="dataMesActual" 
            tipo = "nissan-detalle"
            [dataMesAnterior]="dataMesAnterior"
            ></app-card-prestamos>
    </div>
    <div class="col-xl-6">
            <app-card-prestamos
            [dataMes]="dataMesActual"
            tipo = "nissan-detalle" 
            [dataMesAnterior]="dataMesAnterior"
            concepto = "plan_piso"
            ></app-card-prestamos>
    </div>
</div>
<!-- cotos financieros y bonos marcas -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-6">
        <app-grafica-barras-totales 
            [dataMes]="dataMesActual" 
            [dataMesAnterior]="dataMesAnterior"
            tipo = "nissan-detalle" 
            concepto="costos_financieros"
        ></app-grafica-barras-totales>
    </div>
    <div class="col-xl-6">
        <app-grafica-donut
            [dataMes]="dataMesActual"
            [dataMesAnterior]="dataMesAnterior" 
            tipo = "nissan-detalle"
            concepto="bono_marca"
        ></app-grafica-donut>
    </div>
</div>
<!-- Antiguedad inventario -->
<div class="row" *ngIf="!isLoad" @fadeSlideInOut>
    <div class="col-xl-6">
        <app-stack-grafica
            tipo = "nissan-ant-detalle"
            [dataAntInventario] = "dataAntInventario"
            filtro = "Consolidado"
            concepto="ant_inv_nuevo"
        ></app-stack-grafica>
    </div>
    <div class="col-xl-6">
        <app-stack-grafica
            tipo = "nissan-ant-detalle"
            filtro = "Consolidado"
            [dataAntInventario] = "dataAntInventario"
            concepto="ant_inv_semi"
        ></app-stack-grafica>
    </div>
</div>
