<div class="card">
    <div class="card-body">
        <h5 class="text-muted mb-4"> <i class="mdi mdi-cash h4 text-warning align-middle mb-0 me-1"></i> {{ title }}</h5>
        <div class="row">
            <div class="col-lg-4">
                <div class="text-muted">
                  <div class="mb-4">
                    <p>Este mes</p>
                    <ng-container >
                      <h4>$ 100,000.00</h4>
                    </ng-container>
        
                    <div>
                      <ng-container>
                        <span class="badge badge-soft-success font-size-12 me-1">
                          + 10,000</span
                        >
                      </ng-container>
                    </div>
                  </div>
        
                  <div>
                    <a
                      class="btn btn-primary btn-sm"
                      >Ver Detalle</a
                    >
                  </div>
        
                  <div class="mt-4">
                    <p class="mb-2">El mes pasado:</p>
                    <h5>$ 90,000</h5>
                  </div>
                </div>
              </div>
            <div class="col-lg-8">
                <div id="chart_radial"></div>
            </div>
        </div>
    </div>
</div>
