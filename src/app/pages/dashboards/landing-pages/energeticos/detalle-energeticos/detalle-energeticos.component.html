<div class="row">
    <div class="col-12">
        <div class="page-title-box d-flex align-items-center justify-content-between">
            <h4 class="mb-0 font-size-18">Gaseras - {{concepto}} Marzo 2024</h4>
            <div class="page-title-right ">
                <ol class="breadcrumb m-0 ">
                    <ng-container>
                        <li class="breadcrumb-item"><a href="javascript: void(0);">Detalle {{concepto}}</a>
                        </li>
                        <li class="breadcrumb-item active">Gaseras </li>
                    </ng-container>
                </ol>
            </div>
        </div>
    </div>
</div>

<div class="d-flex justify-content-center" *ngIf="isLoad">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

<div class="row" *ngIf="!isLoad">
    <div class="col-xl-12">
        <div class="row">
            <div class="col-sm-12">
                <app-anual  [concepto]="concepto"></app-anual>
            </div>
        </div>
    </div>
</div>

<div class="row" *ngIf="!isLoad">
    <div class="col-xl-6">
        <div class="row">
            <div class="col-sm-12">
                <app-tabla  [concepto]="concepto"></app-tabla>
            </div>
        </div>
    </div>
</div>
