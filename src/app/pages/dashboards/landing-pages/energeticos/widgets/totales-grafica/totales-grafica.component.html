<div class="card">
    <div class="card-body">
        <div class="clearfix">
            <div class="float-end">
                <div class="input-group input-group-sm">
                    <select class="form-select form-select-sm" >
                        <option value="january" selected>Ene</option>
                        <option value="december">Feb</option>
                        <option value="november">Maz</option>
                        <option value="october">Abr</option>
                    </select>
                    <label class="input-group-text">Mes</label>
                </div>
            </div>
            <h4 class="card-title mb-4">{{title}}</h4>
        </div>
        
        <div class="row">
            <div class="col-lg-4">
                <div class="text-muted">
                    <div class="mb-4">
                        <p>Este mes</p>
                        <h4>$ {{ dataMes[16][concepto] | number }}</h4>
                        <div>
                            <ng-container *ngIf="diferencia > 0; else elseTemplate">
                                <span class="badge badge-soft-success font-size-12 me-1"> + {{ (dataMes[16][concepto] -  dataMesAnterior[16][concepto]) | number }}</span> 
                            </ng-container>
                            <ng-template #elseTemplate>
                                <span class="badge badge-soft-danger font-size-12 me-1"> - {{ (dataMes[16][concepto] -  dataMesAnterior[16][concepto]) | number }}</span> 
                            </ng-template>
                            
                        </div>
                    </div>

                    <div>
                        <a [routerLink]="[ '../energeticos-detalle/', concepto ]">Ver Detalle</a>
                        <a href="#" class="btn btn-primary btn-sm">Ver Detalles <i class="mdi mdi-chevron-right ms-1"></i></a>
                    </div>

                    <div class="mt-4">
                        <p class="mb-2">El mes pasado:</p>
                        <h5>$ {{ dataMesAnterior[16][concepto] | number }}</h5>
                    </div>

                </div>
            </div>

            <div class="col-lg-8">
                <div id="chart_{{concepto}}"></div>
            </div>
        </div>
    </div>
</div>
