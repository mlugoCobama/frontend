<div class="card">
  <div class="card-body">
    <h5 class="card-title mb-4">{{ concepto | titlecase }}</h5>
    <div class="row">
      <div class="col-4">
        <div class="text-muted">
          <div class="mb-4">
            <p>Este mes</p>
            <ng-container *ngIf="promedioMes > 0; else elseTemplate1">
              <h4>{{ promedioMes | number }} %</h4>
            </ng-container>
            <ng-template #elseTemplate1>
              <h4 class="text-danger">$ {{ promedioMes | number }} %</h4>
            </ng-template>

            <div>
              <ng-container *ngIf="diferencia > 0; else elseTemplate">
                <span class="badge badge-soft-success font-size-12 me-1">
                  + {{ diferencia | number }} %</span
                >
              </ng-container>
              <ng-template #elseTemplate>
                <span class="badge badge-soft-danger font-size-12 me-1">
                  {{ diferencia | number }} % </span
                >
              </ng-template>
            </div>
          </div>

          <div>
            <a
              [routerLink]="['../', tipo, concepto]"
              class="btn btn-primary btn-sm"
              >Ver Detalle</a
            >
          </div>

          <div class="mt-4">
            <p class="mb-2">El mes pasado:</p>
            <h5>{{ promedioMesAnt | number }} % </h5>
          </div>
        </div>
      </div>
      <div class="col-8">
        <div id="chart"></div>
      </div>
    </div>
  </div>
</div>
