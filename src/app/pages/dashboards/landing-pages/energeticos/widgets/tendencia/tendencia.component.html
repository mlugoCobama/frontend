<div class="card">
  <div class="card-body">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="chartOptions"
      [(update)]="updateFlag"
      style="width: 100%; height: 295px; display: block"
    ></highcharts-chart>
    
    <div class="text-center text-muted">
       <ng-container *ngIf="diferencia > 0; else elseTemplate">
                        <p class="text-truncate mb-0 text-success"> 
                            La tendencia es <strong>POSITIVA</strong>
                            <i class="mdi mdi-arrow-up ms-1 text-success"></i>
                        </p>
                    </ng-container>
                    <ng-template #elseTemplate>
                        <p class="text-truncate mb-0 text-danger"> 
                            La tendencia es <strong>NEGATIVA</strong>
                            <i class="mdi mdi-arrow-down ms-1 text-danger"></i>
                        </p>
                    </ng-template>
    </div>
    
  </div>
</div>
