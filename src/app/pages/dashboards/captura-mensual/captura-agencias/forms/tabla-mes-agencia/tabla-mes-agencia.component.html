<form (paste)="onPaste($event)">
  <p *ngIf="showInstructions" class="text-center"><i class="fas fa-paste"></i>&nbsp;<strong>Pega aquí tu tabla de excel</strong></p>

  <table *ngIf="!showInstructions"  class="table table-bordered">
    <thead>
      <tr class="text-center">
        <th>Concepto</th>
        <th *ngFor="let empresa of catEmpresas" ><span>{{ empresa.sub_division }}</span> {{empresa.sucursal}} </th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of dataMesAgencias">
        <td *ngFor="let cell of row" [attr.colspan]="cell.colspan" class="text-center">
          {{ cell.value }}
        </td>
      </tr>
    </tbody>
  </table>
</form>
