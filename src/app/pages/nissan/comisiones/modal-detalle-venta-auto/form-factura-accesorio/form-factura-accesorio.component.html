<form [formGroup]="form" class="needs-validation" novalidate>
  <div class="row g-2 align-items-end">

    <!-- No. Factura y Botón Asignar -->
    <div class="col-md-12 col-sm-12 mb-3" >
      <label for="no_factura" class="form-label form-label-sm mb-1">No. Factura</label>
      <div class="input-group input-group-sm">
        <input
          type="text"
          id="no_factura"
          formControlName="no_factura"
          class="form-control form-control-sm"
          [ngClass]="{'is-invalid': form.get('no_factura')?.touched && form.get('no_factura')?.invalid}"
          placeholder="Ingrese número de factura">
        <button
          type="button"
          class="btn btn-outline-primary btn-sm fw-semibold"
          [disabled]="loading"
          (click)="asignarFactura()">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
           <i *ngIf="!loading" class="fas fa-plus me-1"></i> Agregar
        </button>
        <div class="invalid-feedback" *ngIf="form.get('no_factura')?.hasError('required')">
          El número de factura es obligatorio.
        </div>
      </div>
    </div>
