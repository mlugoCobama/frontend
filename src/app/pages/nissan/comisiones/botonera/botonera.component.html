  <div class="card shadow-sm rounded-4 " *ngIf="estado > 0">
    <div class="card-body">
        <div class="d-flex justify-content-end align-items-end gap-2">
              <button
                *ngIf="(estado == 1 || estado == 12345) && tienePermiso(permisos.btnEntregados)"
                class="btn btn-sm fw-semibold btn-primary"
                [disabled]="guardandoE"
                (click)="guardarEntregados()"
              >
                <span *ngIf="!guardandoE"> <i class="fas fa-car me-1"></i> Guardar entregados</span>

                <span
                  *ngIf="guardandoE"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>

              </button>
              <button
                *ngIf="(estado == 2 || estado == 12345) && tienePermiso(permisos.btnGastos)"
                class="btn btn-sm fw-semibold btn-info"
                [disabled]="guardandoG"
                (click)="guardarGastos()"
              >
                <span *ngIf="!guardandoG">  <i class="fas fa-money-bill-wave-alt me-1"></i> Guardar Gastos</span>

                <span
                  *ngIf="guardandoG"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>

              <button
                *ngIf="(estado == 2 || estado == 12345) && tienePermiso(permisos.btnGastos)"
                class="btn btn-sm fw-semibold btn-dark"
                [disabled]="guardandoBdc"
                (click)="guardarBDC()"
              >
                <span *ngIf="!guardandoBdc"> <i class="fas fa-headset  me-1"></i> Marcar BDC</span>

                <span
                  *ngIf="guardandoBdc"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>

              <button
                *ngIf="(estado == 2 || estado == 12345) && tienePermiso(permisos.btnGastos)"
                class="btn btn-sm fw-semibold btn-warning"
                [disabled]="guardandovBdc"
                (click)="guardarValidadosBDC()"
              >
                <span *ngIf="!guardandovBdc"> <i class="fas fa-headset  me-1"></i>  Validar BDC</span>

                <span
                  *ngIf="guardandovBdc"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>
              <button
                *ngIf="(estado == 3 || estado == 12345) && tienePermiso(permisos.btnValidados)"
                class="btn btn-sm fw-semibold btn-success"
                [disabled]="guardandoV"
                (click)="guardarValidados()"
              >
                <span *ngIf="!guardandoV"> <i class="fas fa-check-double me-1"></i>  Guardar Validados</span>

                <span
                  *ngIf="guardandoV"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>
              <!-- <button *ngIf="estado == 4 || estado == 12345 " (click)="guardarEntregados()" class="btn btn-sm fw-semibold btn-success">Guardar Pagados</button> -->
        </div>
    </div>
</div>
