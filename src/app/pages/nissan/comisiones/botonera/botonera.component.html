  <div class="card shadow-sm" *ngIf="estado > 0">
    <div class="card-body">
        <div class="d-flex justify-content-end align-items-end gap-2">
              <button
                *ngIf="(estado == 1 || estado == 12345) && tienePermiso(permisos.btnEntregados)"
                class="btn btn-sm btn-primary"
                [disabled]="guardandoE"
                (click)="guardarEntregados()"
              >
                <span *ngIf="!guardandoE">Guardar entregados</span>

                <span
                  *ngIf="guardandoE"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>
              <button
                *ngIf="(estado == 2 || estado == 12345) && tienePermiso(permisos.btnGastos)"
                class="btn btn-sm btn-info"
                [disabled]="guardandoG"
                (click)="guardarGastos()"
              >
                <span *ngIf="!guardandoG">Guardar Gastos</span>

                <span
                  *ngIf="guardandoG"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>

              <button
                *ngIf="(estado == 2 || estado == 12345) && tienePermiso(permisos.btnGastos)"
                class="btn btn-sm btn-dark"
                [disabled]="guardandoBdc"
                (click)="guardarBDC()"
              >
                <span *ngIf="!guardandoBdc">Marcar BDC</span>

                <span
                  *ngIf="guardandoBdc"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>

              <button
                *ngIf="(estado == 2 || estado == 12345) && tienePermiso(permisos.btnGastos)"
                class="btn btn-sm btn-warning"
                [disabled]="guardandovBdc"
                (click)="guardarValidadosBDC()"
              >
                <span *ngIf="!guardandovBdc">Validar BDC</span>

                <span
                  *ngIf="guardandovBdc"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button> 
              <button
                *ngIf="(estado == 3 || estado == 12345) && tienePermiso(permisos.btnValidados)"
                class="btn btn-sm btn-success"
                [disabled]="guardandoV"
                (click)="guardarValidados()"
              >
                <span *ngIf="!guardandoV">Guardar Validados</span>

                <span
                  *ngIf="guardandoV"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
              </button>
              <!-- <button *ngIf="estado == 4 || estado == 12345 " (click)="guardarEntregados()" class="btn btn-sm btn-success">Guardar Pagados</button> -->
        </div> 
    </div>
</div>
