<div class="card shadow-sm rounded-4 border-0">
  <div class="card-body">

    <form [formGroup]="filtroForm" (ngSubmit)="buscar()">

      <div class="row g-3 align-items-end">

        <!-- Agencia -->
        <div class="col-lg-2 col-md-3">
          <label class="form-label fw-semibold">Empresa</label>
          <select
            class="form-select form-select-sm"
            formControlName="intercompania">

            <option selected disabled value="">Selecciona uno</option>
            <option value="">Todos</option>
            <option
              *ngFor="let empresa of empresas"
              [hidden]="!tienePermiso(empresa.permiso)"
              [value]="empresa.intercompania">

              {{ empresa.name }}

            </option>
          </select>
        </div>

        <!-- APS -->
        <div class="col-lg-2 col-md-3">
          <label class="form-label fw-semibold">Proveedores</label>

          <select
            class="form-select form-select-sm"
            formControlName="proveedor"
            [disabled]="!filtroForm.value.agencia">

            <option selected disabled value="">Selecciona uno</option>
             <option value="">Todos</option>
            <option
              *ngFor="let proveedor of proveedores"
              [value]="proveedor.id">

              {{ proveedor.nombre }}

            </option>

          </select>
        </div>

        <!-- Fecha Inicio -->
        <div class="col-lg-2 col-md-3">
          <label class="form-label fw-semibold">Fecha Inicio</label>

          <input
            [max]="hoy"
            type="date"
            class="form-control form-control-sm"
            formControlName="fechaInicio">
        </div>

        <!-- Fecha Fin -->
        <div class="col-lg-2 col-md-3">
          <label class="form-label fw-semibold">Fecha Fin</label>

          <input
            type="date"
            [max]="hoy"
            class="form-control form-control-sm"
            formControlName="fechaFin"
            [min]="filtroForm.value.fechaInicio">
        </div>

        <!-- Botones -->
        <div class="col-lg-4">

          <div class="d-flex gap-2">

            <button
              type="submit"
              class="btn btn-sm btn-primary fw-bold  px-4"
              [disabled]="loading">

              <span
                *ngIf="loading"
                class="spinner-border spinner-border-sm me-2">
              </span>
              <i class="fas fa-search"></i>
              Buscar

            </button>

            <!-- <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="limpiar()">

              Limpiar

            </button> -->

          </div>

        </div>

      </div>

    </form>

  </div>
</div>
