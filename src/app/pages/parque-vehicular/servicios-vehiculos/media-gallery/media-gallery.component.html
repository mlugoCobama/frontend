<div class="card shadow-sm rounded-4">
  <!-- HEADER -->
  <div class="card-header rounded-top-4 d-flex justify-content-between align-items-center py-3 border-bottom border-primary">
    <h5 class="fw-bold text-dark m-0">
      <i [class]="iconClass + ' text-primary me-2'"></i> {{ title }}
    </h5>

    <!-- Botón de Carga Dinámico -->
    <div *ngIf="showUploadButton">
      <input
        type="file"
        #fileInput
        class="d-none"
        accept="image/*,video/*"
        multiple
        (change)="onFileChange($event)">
      <button
        type="button"
        class="btn btn-secondary btn-sm text-dark fw-bold rounded-3 shadow-sm"
        (click)="fileInput.click()">
        <i class="fas fa-paperclip me-1"></i> {{ uploadButtonText }}
      </button>
    </div>
  </div>

  <div class="card-body p-3 p-md-4">

    <!-- SECCIÓN: ARCHIVOS SELECCIONADOS EN COLA / PREVISUALIZACIÓN -->
    <div *ngIf="stagedFiles.length > 0" class="mb-4 p-3 bg-light rounded-4 border border-warning border-opacity-50 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold text-dark m-0 d-flex align-items-center">
          <i class="fas fa-images text-warning me-2"></i> Archivos Seleccionados
          <span class="badge bg-warning text-dark ms-2 rounded-pill">{{ stagedFiles.length }}</span>
        </h6>
        <div>
          <button type="button" class="btn btn-outline-secondary btn-sm rounded-3 me-2" (click)="clearStagedFiles()">
            <i class="fas fa-times me-1"></i> Cancelar
          </button>
          <button type="button" class="btn btn-warning btn-sm text-dark fw-bold rounded-3 shadow-sm" (click)="confirmUpload()">
            <i class="fas fa-upload me-1"></i> Guardar Evidencias
          </button>
        </div>
      </div>

      <!-- Carrusel de Previsualización -->
      <div class="carousel slide bg-dark rounded-4 overflow-hidden shadow-sm">

        <!-- Indicadores -->
        <div class="carousel-indicators mb-2" *ngIf="stagedFiles.length > 1">
          <button
            *ngFor="let staged of stagedFiles; let i = index"
            type="button"
            [class.active]="i === stagedActiveIndex"
            (click)="stagedActiveIndex = i">
          </button>
        </div>

        <div class="carousel-inner">
          <div
            *ngFor="let staged of stagedFiles; let i = index"
            class="carousel-item"
            [class.active]="i === stagedActiveIndex">

            <div class="position-relative d-flex justify-content-center align-items-center bg-black" style="min-height: 320px; max-height: 450px;">

              <!-- Botón Retirar -->
              <button
                type="button"
                class="btn btn-danger btn-sm rounded-circle position-absolute top-0 end-0 m-3 shadow z-3"
                style="width: 32px; height: 32px; padding: 0;"
                title="Retirar de la lista"
                (click)="removeStagedFile(i)">
                <i class="fas fa-trash"></i>
              </button>

              <!-- Previsualización Imagen -->
              <img
                *ngIf="staged.media_type === 'image'"
                [src]="staged.previewUrl"
                class="d-block w-100 object-fit-contain"
                alt="Previsualización"
                style="max-height: 450px;">

              <!-- Previsualización Video -->
              <video
                *ngIf="staged.media_type === 'video'"
                class="d-block w-100"
                controls
                style="max-height: 450px;"
                (click)="$event.stopPropagation()">
                <source [src]="staged.previewUrl">
              </video>
            </div>

            <!-- Campo Comentario / Descripción -->
            <div class="p-3 bg-white border-top">
              <label class="form-label small fw-bold text-muted mb-1">
                <i class="fas fa-comment-alt me-1"></i> Comentario / Anotación ({{ i + 1 }} de {{ stagedFiles.length }}):
              </label>
              <textarea
                class="form-control form-control-sm rounded-3 resize-none"
                rows="2"
                placeholder="Escribe un comentario..."
                [(ngModel)]="staged.descripcion">
              </textarea>
            </div>
          </div>
        </div>

        <!-- Controles de Navegación -->
        <ng-container *ngIf="stagedFiles.length > 1">
          <button class="carousel-control-prev" type="button" (click)="prevStaged()">
            <span class="carousel-control-prev-icon bg-dark bg-opacity-50 rounded-circle p-3" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" (click)="nextStaged()">
            <span class="carousel-control-next-icon bg-dark bg-opacity-50 rounded-circle p-3" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </ng-container>
      </div>
    </div>

    <!-- SECCIÓN: GALERÍA DE ARCHIVOS EXISTENTES -->
    <ng-container *ngIf="filteredItems.length > 0; else noData">
      <div class="carousel slide bg-dark rounded-4 overflow-hidden shadow-sm">

        <!-- Indicadores -->
        <div class="carousel-indicators mb-2" *ngIf="filteredItems.length > 1">
          <button
            *ngFor="let item of filteredItems; let i = index"
            type="button"
            [class.active]="i === existingActiveIndex"
            (click)="existingActiveIndex = i">
          </button>
        </div>

        <div class="carousel-inner">
          <div
            *ngFor="let item of filteredItems; let i = index"
            class="carousel-item"
            [class.active]="i === existingActiveIndex">

            <div class="position-relative d-flex justify-content-center align-items-center bg-black" style="min-height: 350px; max-height: 500px;">

              <!-- Botón Borrar -->
              <button
                *ngIf="allowDeleteExisting"
                type="button"
                class="btn btn-danger btn-sm rounded-circle position-absolute top-0 end-0 m-3 shadow z-3"
                style="width: 32px; height: 32px; padding: 0;"
                title="Eliminar evidencia"
                (click)="onDeleteExisting(item)">
                <i class="fas fa-trash-alt fa-sm"></i>
              </button>

              <!-- Contador -->
              <span class="badge bg-dark bg-opacity-75 text-white position-absolute top-0 start-0 m-3 px-3 py-2 rounded-pill z-3">
                {{ i + 1 }} / {{ filteredItems.length }}
              </span>

              <!-- IMAGEN -->
              <img
                *ngIf="item.media_type === 'image'"
                [src]="item.imagen"
                class="d-block w-100 object-fit-contain"
                loading="lazy"
                decoding="async"
                alt="Testigo visual"
                style="max-height: 500px;">

              <!-- VIDEO -->
              <video
                *ngIf="item.media_type === 'video'"
                class="d-block w-100"
                controls
                preload="metadata"
                style="max-height: 500px;"
                (click)="$event.stopPropagation()">
                <source [src]="item.imagen" type="video/mp4">
                Tu navegador no soporta videos.
              </video>
            </div>

            <!-- Descripción -->
            <div class="p-3 bg-white border-top">
              <p class="card-text m-0 text-dark">
                <span class="fw-semi-bold text-secondary">Descripción: </span>
                {{ item.descripcion || 'Sin anotaciones' }}
              </p>
            </div>
          </div>
        </div>

        <!-- Controles de Navegación -->
        <ng-container *ngIf="filteredItems.length > 1">
          <button class="carousel-control-prev" type="button" (click)="prevExisting()">
            <span class="carousel-control-prev-icon bg-dark bg-opacity-50 rounded-circle p-3" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" (click)="nextExisting()">
            <span class="carousel-control-next-icon bg-dark bg-opacity-50 rounded-circle p-3" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </ng-container>
      </div>
    </ng-container>

    <!-- MENSAJE VACÍO -->
    <ng-template #noData>
      <div *ngIf="stagedFiles.length === 0" class="text-center text-muted py-5">
        <i class="fas fa-folder-open fa-3x mb-3 opacity-50 text-secondary"></i>
        <p class="m-0 fw-semibold">No hay evidencias o testigos registrados en esta categoría.</p>
      </div>
    </ng-template>

  </div>
</div>
