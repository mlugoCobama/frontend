<div class="container-fluid">
  <div class="row">
    <div class="col-xl-12">
      <div class="card">
        <div class="card-body border-bottom">
          <div class="d-flex align-items-center">
            <h5 class="mb-0 card-title flex-grow-1">
              Catalogo de Unidades de Medidas
            </h5>
            <div class="flex-shrink-0 d-flex gap-1">
              <a
                href="javascript:void(0);"
                class="btn btn-danger btn-sm"
                (click)="destroy()"
                *ngIf="mostrar"
                >Eliminar</a
              >
              <a
                href="javascript:void(0);"
                class="btn btn-warning btn-sm"
                (click)="openModalActualizar()"
                *ngIf="mostrar"
                >Actualizar</a
              >
              <a
                href="javascript:void(0);"
                class="btn btn-primary btn-sm"
                (click)="openModalNuevo()"
                >Nuevo</a
              >
            </div>
          </div>
        </div>

        <div class="card-body border-bottom">
          <div class="d-flex justify-content-center" *ngIf="isLoad">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div *ngIf="!isLoad" class="row justify-content-end">
            <div class="col-3">
              <input type="text" class="form-control form-control-sm" placeholder="Buscar..." [(ngModel)]="busqueda"  (input)="filtrarTabla()"/>
            </div>
          </div>
          <div style="overflow-y: scroll; height: 20rem;">
            <div class="tab-page-content mt-3 table-responsive">
              <table *ngIf="!isLoad" class="table table-hover table-sm table-bordered">
                <thead class="table-light">
                  <tr>
                    <th (click)="ordenarPor('nombre')">Unidad de Medida <i [ngClass]="getIconoOrden('nombre')"></i></th>
                    <th (click)="ordenarPor('abreviatura')">Abreviatura <i [ngClass]="getIconoOrden('abreviatura')"></i></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of datosFiltrados" (click)="seleccionar(item, $event)">
                    <td>{{ item.nombre }}</td>
                    <td>{{ item.abreviatura }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <!--div.card-body-->
      </div>
    </div>
  </div>
</div>
<!-- container-fluid -->
