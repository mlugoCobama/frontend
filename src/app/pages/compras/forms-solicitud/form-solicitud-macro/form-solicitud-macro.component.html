<form class="row g-2" [formGroup]="formSolicitudCompra">
  <div class="col-md-6">
    <label for="empresa" class="form-label form-label-sm">Empresa: *</label>

    <select
      *ngIf="tienePermiso('view select emp users compras') === true; else nombreEmpresa"
      class="form-select form-select-sm"
      aria-label="Default select example"
      formControlName="empresa"
      id="empresa"
      name="empresa"
      aria-label="empresa"
      (change)="getAutotanques($event.target.value)"
    >
      <option value="" selected disabled>Selecciona uno</option>
      <option *ngIf="isLoading" value="" [disabled]="isLoading">
        Cargando opciones espera...
      </option>
      
      <option *ngFor="let item of empresas" [value]="item.intercompania" [hidden]="!tienePermiso(item.permiso)">
        {{ item.name.toUpperCase() }}
      </option>
    </select>
    <div
      *ngIf="
        solicitudCompraFormControl.empresa.touched ||
        submitted ||
        solicitudCompraFormControl.empresa.value === 'Selecciona uno'
      "
    >
      <div
        class="text-danger form-text"
        *ngIf="solicitudCompraFormControl.empresa.errors?.['required']"
      >
        Debes de seleccionar una empresa.
      </div>
    </div>
  </div>

  <div class="col-md-6" *ngIf ="!isAgencia">
      <label for="usuario_destino" class="form-label">Autotanques: *</label>
      <select class="form-select form-select-sm" aria-label="Default select example" formControlName="usuario_destino" id="usuario_destino" 
      name="usuario_destino" aria-label="usuario_destino" (change)="setDato($event.target.value)">
        <option value="" selected disabled>Selecciona uno</option>
        <option *ngIf = "!isLoad" value="" [disabled] = "!isLoad"> Cargando opciones espera...</option>
        <option [disabled] = "disabled" *ngFor="let item of autotanques" [value]="item.id ">
          ECO: {{ item.eco }} {{ item.marca_vehiculo }} {{item.submarca}}({{ item.modelo}}) PLACAS: {{ item.placas }}
        </option>
      </select>
      <div *ngIf="solicitudCompraFormControl.usuario_destino.touched || submitted">
        <div
          class="text-danger form-text" *ngIf="solicitudCompraFormControl.usuario_destino.errors?.['required']">
          Autotanques es requerido.
        </div>
      </div>
    </div>


  <div class="col-md-12">
    <label for="motivo" class="form-label">Motivo de la compra: *</label>
    <textarea
      class="form-control"
      formControlName="motivo"
      id="motivo"
      name="motivo"
      rows="3"
    ></textarea>
    <div *ngIf="solicitudCompraFormControl.motivo.touched || submitted">
      <div
        class="text-danger form-text"
        *ngIf="solicitudCompraFormControl.motivo.errors?.['required']"
      >
        Motivo es requerido.
      </div>
    </div>
  </div>
  <div class="form-group col-md-3">
    <label >Orden de trabajo: *</label>
    <input
      type="text"
      class="form-control form-control-sm"
      formControlName="orden_trabajo"
      placeholder="# orden de trabajo"
    />
    <div *ngIf="solicitudCompraFormControl.orden_trabajo.touched || submitted">
      <small
        *ngIf="solicitudCompraFormControl.orden_trabajo.errors?.['required']"

        class="text-danger form-text"
        >Orden de trabajo es requerido</small
      >
    </div>
  </div>
  <div class="form-group col-md-3">
    <label >Folio de requisición: *</label>
    <input
      type="text"
      class="form-control form-control-sm"
      formControlName="folio_requisicion"
      placeholder="# Folio requisición"
    />
    <div *ngIf="solicitudCompraFormControl.folio_requisicion.touched || submitted">
      <small
        *ngIf="solicitudCompraFormControl.folio_requisicion.errors?.['required']"

        class="text-danger form-text"
        >Folio de requisición es requerido</small
      >
    </div>
  </div>
  <div class="form-group col-md-6">
    <label >Formato de orden de trabajo: <small> *</small>  </label>
    <input
      data-toggle="tooltip" 
      title="Cotización en formato PDF."
      (change)="onFileChange($event, 'orden_trabajo')"
      accept="application/pdf"
      type="file"
      name="formato_orden_trabajo" 
      formControlName="formato_orden_trabajo"
      class="form-control form-control-sm"
      placeholder="# orden de trabajo"
    />
    <div *ngIf="solicitudCompraFormControl.formato_orden_trabajo.touched || submitted">
      <small
        *ngIf="solicitudCompraFormControl.formato_orden_trabajo.errors?.['required']"

        class="text-danger form-text"
        >Formato de orden de trabajo es requerido</small
      >
    </div>
  </div>
  <div class="form-group  col-md-6">
    <label >Cotización: <small> (Opcional) </small>  </label>
    <input
      data-toggle="tooltip" 
      title="Cotización en formato PDF."
      (change)="onFileChange($event, 'cotizacion')"
      accept="application/pdf"
      type="file"
      name="cotizacion" 
      formControlName="cotizacion"
      class="form-control form-control-sm"
      placeholder="# orden de trabajo"
    />
    <div *ngIf="solicitudCompraFormControl.cotizacion.touched || submitted">
      <small
        *ngIf="solicitudCompraFormControl.cotizacion.errors?.['required']"

        class="text-danger form-text"
        >Cotización</small
      >
    </div>
  </div>

  <div class="form-group col-md-6 pt-4">
      <div class="d-flex align-items-center m-2">
        <label class="mb-0 me-2">Requiere anticipo*:</label>
    
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="requiere_anticipo" id="inlineRadio1" value="true">
          <label class="form-check-label" for="inlineRadio1">Si</label>
        </div>
    
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" formControlName="requiere_anticipo" id="inlineRadio2" value="false">
          <label class="form-check-label" for="inlineRadio2">No</label>
        </div>
      </div>
      <div *ngIf="solicitudCompraFormControl.requiere_anticipo.touched || submitted">
        <small class="text-danger form-text" *ngIf="solicitudCompraFormControl.requiere_anticipo.errors?.['required']">
          Debes indicar si requiere anticipo.
        </small>
      </div>
    </div>
  <!-- fin primer from -->
</form>
<ng-template #nombreEmpresa>
  <p>
    <strong>{{ usuarioSolicita.empresa }} </strong>
  </p>
</ng-template>
