<div class="position-relative">
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm w-100 text-start d-flex justify-content-between align-items-center"
    [disabled]="disabled"
    [attr.aria-expanded]="abierto"
    aria-haspopup="listbox"
    (click)="toggleMenu()">
    <span class="text-truncate">{{ textoBoton }}</span>
    <i class="bi small" [class.bi-chevron-down]="!abierto" [class.bi-chevron-up]="abierto"></i>
  </button>

  <div
    *ngIf="abierto"
    class="dropdown-menu show w-100 p-2 shadow-sm position-absolute start-0 mt-1"
    style="z-index: 1000; max-height: 250px; overflow-y: auto;">


    <div class="d-flex justify-content-between align-items-center px-1 pb-1 mb-1 border-bottom small text-secondary">
      <div class="me-1">
        <input
        type="text"
        class="form-control form-control-sm"
        placeholder="Buscar proveedor..."
        [(ngModel)]="filtroTexto"
        (click)="$event.stopPropagation()">
      </div>
      <div>
        <span class="text-nowrap mx-1">{{ seleccionados.length }} / {{ max }}</span>
        <button
          *ngIf="seleccionados.length > 0"
          type="button"
          class="btn btn-link btn-sm p-0 text-decoration-none"
          (click)="limpiar()">
          Limpiar
        </button>
      </div>
    </div>

    <div *ngFor="let op of opcionesFiltradas; trackBy: trackById" class="form-check ms-3 p-1">
      <input
        class="form-check-input"
        type="checkbox"
        [id]="'ms-' + op[idKey]"
        [checked]="estaSeleccionado(op)"
        [disabled]="estaBloqueado(op)"
        (change)="toggle(op, $event)">
      <label
        class="form-check-label small w-100"
        [class.text-muted]="estaBloqueado(op)"
        [for]="'ms-' + op[idKey]"
        [style.cursor]="estaBloqueado(op) ? 'not-allowed' : 'pointer'">
        {{ op[labelKey] }}
      </label>
    </div>

    <div *ngIf="!opcionesFiltradas?.length" class="small text-muted px-2 py-1">
      Sin proveedores disponibles
    </div>
  </div>
</div>
