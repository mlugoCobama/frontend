
      <div class="card shadow-sm">
        <div class="card-body border-bottom p-3">
          <div class="d-flex align-items-center">
            <h5 class="mb-0 card-title flex-grow-1">Almacen - {{ panel | titlecase}}</h5>
            <div class="flex-shrink-0 d-flex gap-1">
                <div class="btn-group" role="group" aria-label="Paneles">
                    <button type="button" class="btn btn-sm btn-outline-primary" (click)="setPanel('existencias')">
                        Existencias
                    </button>
                    <!-- <button type="button" class="btn btn-sm btn-outline-success" (click)="setPanel('entradas')">
                        Entradas
                    </button> -->
                    <button type="button" class="btn btn-sm btn-outline-danger" (click)="setPanel('salidas')">
                        Salidas
                    </button>
                </div>
                <button (click)="openModalSsalida()" class="btn btn-sm btn-primary"> <i class="fas fa-plus"></i> Nueva Salida </button>
            </div>
          </div>
        </div>
      </div>

<div class="mt-3">
  <div *ngIf="panel === 'existencias'">
        <app-tabla-generica
        [data]="data" 
        [isLoad] = "isLoad"
        [columnas] = "configTabla"
        ></app-tabla-generica>
  </div>
  <div *ngIf="panel === 'entradas'">
    <p>Aquí va el contenido de entradas.</p>
  </div>
  <div *ngIf="panel === 'salidas'">
    <app-tabla-generica
        [data]="salidas" 
        [isLoad] = "isLoad"
        [columnas] = "configTablaSalidas"
        ></app-tabla-generica>
  </div>
</div>
