
      <div class="card shadow-sm">
        <div class="card-body border-bottom p-3">
          <div class="d-flex align-items-center">
            <h5 class="mb-0 card-title flex-grow-1">Almacen - {{ panel | titlecase}}</h5>
            <div class="flex-shrink-0 d-flex gap-2">
                <div class="btn-group" role="group" aria-label="Paneles">
                  <!-- <button type="button" class="btn btn-sm btn-outline-info fw-semibold" (click)="setPanel('entradas')">
                        Entradas Pendientes
                    </button> -->

                    <button type="button" class="btn btn-sm btn-outline-primary fw-semibold" (click)="setPanel('existencias')">
                        Existencias
                    </button>
                    <!-- <button type="button" class="btn btn-sm btn-outline-success" (click)="setPanel('entradas')">
                        Entradas
                    </button> -->
                    <button type="button" class="btn btn-sm btn-outline-danger fw-semibold" (click)="setPanel('salidas')">
                        Salidas
                    </button>
                </div>
                <!-- <button (click)="openModalSsalida()" class="btn btn-sm btn-info"> <i class="fas fa-plus"></i> Nueva Entrada </button> -->
                <button (click)="openModalSsalida()" class="btn btn-sm btn-danger fw-semibold"> <i class="fas fa-minus"></i> Nueva Salida </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card rounded-4 shadow-sm">
        <div class="card-body">
          <form class="row g-3 align-items-end mb-3">
            <div class="col-md-2">
              <label for="selectTipo" class="form-label fw-semibold text-secondary small">
                Filtrar por Tipo
              </label>
              <select
                id="selectTipo"
                name="tipoId"
                class="form-select form-select-sm rounded-3"
                [(ngModel)]="tiposSalidaSeleccionada"
                (change)="onEmpresaChange()">
                <option *ngIf="" [ngValue]="''">Todas los tipos</option>
                <ng-container *ngFor="let tipo of tiposSalida">
                  <option *ngIf="tienePermiso(tipo.permiso)"  [ngValue]="tipo.tipo">
                    {{ tipo.nombre }}
                  </option>
                </ng-container>
              </select>
            </div>
            <div class="col-md-4">
              <label for="selectEmpresa" class="form-label fw-semibold text-secondary small">
                Filtrar por Empresa
              </label>
              <select
                id="selectEmpresa"
                name="empresaId"
                class="form-select form-select-sm rounded-3"
                [(ngModel)]="empresaSeleccionada"
                (change)="onEmpresaChange()">
                <option [ngValue]="''">Todas las empresas</option>
                <ng-container *ngFor="let emp of empresas">
                    <option *ngIf="tienePermiso(emp.permiso)"  [ngValue]="emp.intercompania">
                    {{ emp.name }}
                </option>
                </ng-container>

              </select>
            </div>
          </form>
        </div>
      </div>

<div class="mt-3">
  <div *ngIf="panel === 'salidas'">
        <app-tabla-generica
        [data]="salidas"
        [isLoad]="isLoad"
        [columnas]="configTablaSalidas"
        (itemSeleccionado)="openModalDetalle($event)"
        ></app-tabla-generica>
  </div>
  <div *ngIf="panel === 'existencias'">
        <app-tabla-existencias
        [existencias]="existencias"
        [modelFiltrado]="modelFiltrado"
        [ordenador]="ordenador"
        [isLoad]="isLoad"

        (filaSeleccionada)="openModalMovimientos($event)">
    </app-tabla-existencias>







  </div>
  <div *ngIf="panel === 'entradas'">
    <app-tabla-generica
        [data]="salidas"
        [isLoad]="isLoad"
        [columnas]="configTablaSalidas"
        ></app-tabla-generica>
  </div>
</div>
