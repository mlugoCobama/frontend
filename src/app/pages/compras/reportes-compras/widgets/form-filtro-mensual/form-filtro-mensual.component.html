<div class="card border">
  <div class="card-header card-header bg-info text-center text-white">
    <strong>Filtro para consultar datos</strong>
  </div>

  <div class="card-body">
    <form [formGroup]="miFormulario " (ngSubmit)="guardar()">
      <div class="row g-3">
        <!-- Campo Tipo -->
        <div class="col-md-4">
          <label class="form-label">Tipo</label>
          <select class="form-select form-select-sm" formControlName="tipo">
            <option value="">Seleccione</option>
            <option value="opcion1">Compras Generales</option>
            <option value="opcion2">Compras Macro Taller</option>
            <option value="opcion3">Compras Recursos Tecnológicos</option>
          </select>
        </div>

        <!-- Fecha Inicial -->
        <div class="col-md-4">
          <label class="form-label">Fecha Inicial</label>
          <input type="date" class="form-control form-control-sm" formControlName="fechaInicial">
        </div>

        <!-- Fecha Final -->
        <div class="col-md-4">
          <label class="form-label">Fecha Final</label>
          <input type="date" class="form-control form-control-sm" formControlName="fechaFinal">
        </div>
      </div>

      <div class="mt-3 d-flex justify-content-end align-items-center">
        <button type="submit" class="btn btn-primary btn-sm">Consultar</button>
      </div>

      
    </form>
  </div>
</div>
