<div class="container-fluid">
  <div class="row">
    <div class="col-xl-12">
      <div class="card rounded-4 shadow-lg m-0">
        <div class="card-body border-bottom">
          <div
            class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center"
          >
            <h5 class="mb-0 card-title flex-grow-1">
              Solicitudes de <strong>Macrotaller</strong>
            </h5>
            <div class="flex-shrink-0 d-flex gap-1 mt-2 mt-lg-0">
              <button
                *ngIf="!solicitudSelecionada"
                class="btn btn-outline-primary btn-sm"
                type="button"
                (click)="vistaKanban = !vistaKanban"
              >
                <i
                  class="fas"
                  [ngClass]="vistaKanban ? 'fa-table' : 'fa-th-large'"
                ></i>
                {{ vistaKanban ? "Ver como tabla" : "Ver como kanban" }}
              </button>

              <app-botnes-admin
                [status]="status"
                [mostrarBoton]="mostrarBoton"
                [solicitudSelecionada]="solicitudSelecionada"
                (btnGenerarOC)="btnGenerarOC()"
                (mostrarCotizacion)="mostrarCotizacion()"
                (cancelarSolicitud)="cancelarSolicitud()"
                (volverCotizar)="volverAcotizar()"
                [tipoCompras]="tipoCompras"
                [tiposPermitidos]="['2']"
                (devolverRevision)="enviarRevisionSolicitud()"
                [isLoadingGenerarOrden]="isLoadingGenerarOrden"
                [isLoadingVolverACotizar]="isLoadingVolverACotizar"
                [isLoadingCancelar]="isLoadingCancelar"
                [isLoadingDevolverRevision]="isLoadingDevolverRevision"
              ></app-botnes-admin>

              <app-bontones-generales
                [status]="status"
                [mostrarBoton]="mostrarBoton"
                [solicitudSelecionada]="solicitudSelecionada"
                (btnDescargarOC)="btnDescargarOC()"
                (regresar)="regresar()"
                (openModalNuevo)="openModalNuevo()"
                [showBtnAdd]="tienePermiso('show btn compras macro')"
              ></app-bontones-generales>
            </div>
          </div>
        </div>
      </div>
      <div [hidden]="solicitudSelecionada" class="card rounded-4 shadow-sm mt-3">
        <div class="card-header border-bottom border-primary rounded-top-4 mb-0 pb-0 bg-white">
          <app-filtro-compras
          [empresas]="empresas"
          [data]="data"
          [anioActual]="anio"
          [mesActual]="mes"
          [empresaSeleccionada]="empresa"
          [viewOptionAll]="tienePermiso('view option all solic macro')"
          [viewSelectEmpresas]="tienePermiso('view select emp users macro')"
          [viewSelectProveedores]="tienePermiso('view select emp quick compras')"
          (filtrosChange)="aplicarFiltros($event)"
          (reload)="recargar($event)"
          ></app-filtro-compras>
        </div>

        <div *ngIf="!solicitudSelecionada" class="card-body border-bottom">
          <div class="d-flex justify-content-center" *ngIf="isLoad">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <div>
          <app-tablero-compras
            *ngIf="!isLoad"
            [vistaKanban]="vistaKanban"
            [isLoad]="isLoad"
            [data]="datosFiltrados"
            [modelBusqueda]="modelBusqueda"
            (openDetalle)="openDetallesSolicitud($event)"
            (openSeguimiento)="openModalSeguimiento($event)"
            (openOrdenCompra)="openModalOC($event)"
          ></app-tablero-compras>
        </div>
      </div>
    </div>
      <div class="mt-3">
        <app-detalle-solicitud-macro
          [solicitudCompra]="solicitudCompra"
          [status]="status"
          [modifica]="modifica"
          *ngIf="solicitudSelecionada"
          (udtStatus)="updateStatus($event)"
        ></app-detalle-solicitud-macro>
      </div>
    </div>
  </div>
</div>

<ng-template #elseBlock>
  <div class="text-center text-muted">
    <Strong>No hay solicitudes para mostrar...</Strong>
  </div>
</ng-template>
