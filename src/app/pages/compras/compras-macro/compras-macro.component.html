<div class="container-fluid">
  <div class="row">
    <div class="col-xl-12">
      <div class="card">
        <div class="card-body border-bottom">
          <div class="d-flex align-items-center">
            <h5 class="mb-0 card-title flex-grow-1"> Solicitudes de <strong>Macrotaller</strong></h5>
            <div class="flex-shrink-0 d-flex gap-1">

              <app-botnes-admin
              [status] = "status"
              [mostrarBoton] = "mostrarBoton"
              [solicitudSelecionada] = "solicitudSelecionada"
              (btnGenerarOC)="btnGenerarOC()"
              (mostrarCotizacion)="mostrarCotizacion()"
              (cancelarSolicitud)="cancelarSolicitud()"
              ></app-botnes-admin>

              <app-bontones-generales
              [status] = "status"
              [mostrarBoton] = "mostrarBoton"
              [solicitudSelecionada] = "solicitudSelecionada"
              (btnDescargarOC)="btnDescargarOC()"
              (regresar)="regresar()"
              (openModalNuevo)="openModalNuevo()"
              ></app-bontones-generales>

            </div>
          </div>
        </div>
          <div *ngIf="!solicitudSelecionada" class="card-body border-bottom">
            <div class="d-flex justify-content-center"  *ngIf="isLoad">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
            <div>
              <div *ngIf="!isLoad" class="row" [ngClass]="'justify-content-between'">
                <div class="col-3">
                <label *ngIf="usuarioSolicita?.multiselect === true" for="empresa" class="form-label form-label-sm">Empresa: *</label>

                <select *ngIf="usuarioSolicita?.multiselect  &&  !modifica && tipo === 'gasera' " class="form-select form-select-sm"
                  aria-label="Default select example" id="empresa" name="empresa" aria-label="empresa"
                  (change)="getAll($event.target.value)">
                  <option value="" selected disabled>Selecciona uno</option>
                  <option *ngIf="isLoading" value="" [disabled]="isLoading">
                    Cargando opciones espera...
                  </option>
                  <option *ngFor="let item of empresas" [value]="item.intercompania">
                    {{ item.name.toUpperCase() }}
                  </option>
                </select>
              
                <select *ngIf="usuarioSolicita?.multiselect === true && (tipo === 'macro' || tipo === 'compras')" class="form-select form-select-sm"
                  aria-label="Default select example" id="empresa" name="empresa" aria-label="empresa"
                  [(ngModel)]="busqueda2"
                  (change)="filtrarTabla2()"
                  >
                  <option value="" selected>Todas</option>
                  <option *ngIf="isLoading" value="" [disabled]="isLoading">
                    Cargando opciones espera...
                  </option>
                  <option *ngFor="let item of empresas" [value]="item.name">
                    {{ item.name.toUpperCase() }}
                  </option>
                </select>
              </div>
                <div class="col-3 pt-4">
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    placeholder="Buscar..."
                    [(ngModel)]="busqueda"
                    (input)="filtrarTabla()"
                  />
                </div>
              </div>
              <div class="table-responsive">
                <div
                  class="tab-page-content mt-3 table-responsive"  style="overflow-y: auto; height: 20rem">
                  <table *ngIf="!isLoad && datosFiltrados.length > 0; else elseBlock"
                    class="table table-striped table-hover table-sm table-bordered"
                  >
                    <thead class="table-light" [ngClass] = "modalAbierto === false ? 'sticky-top' : '' ">
                      <tr>
                        <th style="cursor: pointer" (click)="ordenarPor('folio')">Folio <i [ngClass]="getIconoOrden('folio')"></i></th>
                        <th style="cursor: pointer" (click)="ordenarPor('empresa')" >Empresa <i [ngClass]="getIconoOrden('empresa')"></i></th>
                        <th style="cursor: pointer" (click)="ordenarPor('usuario_solicita')" >Solicita <i [ngClass]="getIconoOrden('usuario_solicita')"></i></th>
                        <th style="cursor: pointer" (click)="ordenarPor('usuario_destino')">Unidad Destino <i [ngClass]="getIconoOrden('usuario_destino')"></i></th>
                        <th style="cursor: pointer" (click)="ordenarPor('fecha')">Fecha Solicitud <i [ngClass]="getIconoOrden('fecha')"></i></th>
                        <th class="text-center" style="cursor: pointer" (click)="ordenarPor('estado')">Estatus <i [ngClass]="getIconoOrden('estado')"></i></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor ="let item of datosFiltrados" (dblclick)="openDetallesSolicitud(item, $event)">
                        <td class="d-flex justify-content-between">{{ item.folio }} <i class="fas fa-info-circle" style="cursor: pointer" (click) = "openModalSeguimiento(item)"></i> </td>
                        <td class="text-center"><span
                            >
                            {{ item.empresa }}
                          </span>
                        </td>
                        <!-- <td>{{ item.empresa }}</td> -->
                        <td>{{ item.usuario_solicita}}</td>
                        <td>{{ item.usuario_destino }}</td>
                        <td>{{ item.fecha  | date:'dd/MM/yyyy h:mm a'}}</td>
                        <td class="text-center"><span
                            [ngClass]="'badge rounded-pill font-size-11 ' +item.claseEstado">
                            {{ item.estado }}
                          </span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        <app-detalle-solicitud-macro
          [solicitudCompra]="solicitudCompra"
          [status]="status"
          [modifica]="modifica"
          *ngIf="solicitudSelecionada"
          (udtStatus)="updateStatus($event)"
        ></app-detalle-solicitud-macro>  
      </div>
    </div>
  </div>
</div>
<ng-template #elseBlock>
  <div class="text-center text-muted">
    <Strong>No hay solicitudes para mostrar...</Strong>
  </div>
</ng-template>
