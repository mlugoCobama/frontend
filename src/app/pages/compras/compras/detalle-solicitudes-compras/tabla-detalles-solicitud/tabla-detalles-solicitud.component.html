<div class="d-flex justify-content-center" *ngIf="isLoad">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>
<div class="pb-2" *ngIf="!isLoad">
  <form [formGroup]="formulario">
    <div class="d-flex justify-content-end pb-2 gap-2">
      <button
        *ngIf = "modifica"
        class="btn btn-secondary btn-sm"
        type="button"
        (click)="toggleModoLectura()"
      >
        <i [ngClass]="modoLectura ? 'bx bx-pencil' : 'bx bx-show-alt'"></i>
        {{ modoLectura ? "Editar" : "Vista solo lectura" }}
      </button>

      <button
        *ngIf="!modoLectura"
        type="button"
        class="btn btn-primary btn-sm"
        (click)="agregarDetalle()"
        [disabled]="sending"
      >
      <i class="fas fa-plus-square"></i>
      
        Agregar detalle
      </button>
      
      <button
        *ngIf="!modoLectura"
        (click)="modificarDetalles()"
        class="btn btn-success btn-sm"
        [disabled]="formulario.invalid || sending"
      >
        <i class="bx bxs-save"></i>
        Guardar cambios
      </button>
    </div>
    <table
      class="table table-striped table-hover table-sm table-bordered table-responsive"
      id="tableCompraInsumos"
    >
      <thead class="table-light">
        <tr>
          <th>Cantidad</th>
          <th>Unidad de Medida</th>
          <th>Descripción</th>
          <th>Observaciones</th>
          <th>Ref. fotográfica</th>
          <th *ngIf = "modifica">Autorizado</th>
          <th *ngIf="mostrarTotal">Quitar</th>
        </tr>
      </thead>

      <tbody formArrayName="detalles">
        <!-- datos de la tabla detalle -->
        <tr
          *ngFor="let detalle of detalles.controls; let i = index"
          [formGroupName]="i"
        >
          <td style="width: 6.87rem">
            <input
              id="cantidad"
              name="cantidad"
              aria-label="cantidad"
              placeholder="Cantidad"
              min="1"
              type="number"
              formControlName="cantidad"
              class="form-control form-control-sm"
            />
            <!-- VALIDACIÓN -->
            <div
              *ngIf="
                getDetalleControl(i, 'cantidad').touched || submittedDetail
              "
            >
              <div
                class="text-danger form-text"
                *ngIf="getDetalleControl(i, 'cantidad').errors?.['required']"
              >
                Cantidad es requerido.
              </div>
            </div>
          </td>

          <td>
            <select
              id="unidadMedida"
              name="unidadMedida"
              aria-label="unidadMedida"
              formControlName="unidadMedida"
              class="form-select form-select-sm"
            >
              <option [ngValue]="null">Seleccione…</option>
              <option *ngFor="let u of unidadMedidas" [value]="u.id">
                {{ u.nombre }} ({{ u.abreviatura }})
              </option>
            </select>
            <div
              *ngIf="
                getDetalleControl(i, 'unidadMedida').touched || submittedDetail
              "
            >
              <div
                class="text-danger form-text"
                *ngIf="getDetalleControl(i, 'unidadMedida').errors?.['required']"
              >
                Unidad de Medida es requerido.
              </div>
            </div>
          </td>
          <td>
            <input
              id="descripcion"
              name="descripcion"
              aria-label="descripcion"
              placeholder="Descripcion"
              type="text"
              formControlName="descripcion"
              class="form-control form-control-sm"
            />
            <div
              *ngIf="
                getDetalleControl(i, 'descripcion').touched || submittedDetail
              "
            >
              <div
                class="text-danger form-text"
                *ngIf="getDetalleControl(i, 'descripcion').errors?.['required']"
              >
                Descripcion es requerido.
              </div>
            </div>
          </td>
          <td>
            <input
              id="observaciones"
              name="observaciones"
              aria-label="observaciones"
              placeholder="Observaciones"
              type="text"
              formControlName="observaciones"
              class="form-control form-control-sm"
            />
            <div
              *ngIf="
                getDetalleControl(i, 'observaciones').touched || submittedDetail
              "
            >
              <div
                class="text-danger form-text"
                *ngIf="getDetalleControl(i, 'observaciones').errors?.['required']"
              >
                Observaciones es requerido.
              </div>
            </div>
          </td>
          <td style="width: 7.5rem" class="text-center">
            <a
              *ngIf="
                getDetalleControl(i, 'img_referencia')?.value;
                else elseBlock
              "
              href="javascript:void(0);"
              class="btn btn-info btn-sm"
              (click)="
                verReferencia(getDetalleControl(i, 'img_referencia')?.value)
              "
            >
              <i class="fas fa-eye"></i
            ></a>
          </td>
          <td *ngIf="modifica" style="width: 6rem" class="text-center">
            <input
              type="checkbox"
              class=""
              [checked]="detalle.get('confirmado')?.value === 1"
              (change)="
                detalle
                  .get('confirmado')
                  ?.setValue($event.target.checked ? 1 : 0)
              "
            />
          </td>
          <td *ngIf="getDetalleControl(i, 'id')?.value === null" class="text-center">
            <button
              type="button"
              class="btn btn-danger btn-sm"
              (click)="eliminarDetalle(i)"
            >
            <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
      </tbody>
      <tfoot *ngIf="mostrarTotal">
        <tr>
          <td [attr.colspan]="6" class="text-end">
            <Strong>SUB-TOTAL (sin iva)</Strong>
          </td>
        </tr>
      </tfoot>
    </table>
  </form>
  <ng-template #elseBlock><i class="fas far fa-eye-slash"></i></ng-template>
</div>
