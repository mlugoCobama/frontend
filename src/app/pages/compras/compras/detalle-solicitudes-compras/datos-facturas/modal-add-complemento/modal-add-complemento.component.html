<div class="modal-header">
  <h5 class="modal-title" id="exampleModalLabel">
    Adjunta el complemento de pago.
  </h5>
  <button (click)="cerrarModal()" type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal"></button>
</div>
  <div class="modal-body">
    <app-form-complemento
    #formComplemento
    ></app-form-complemento>
  </div>
<div class="modal-footer">
  <button
  (click)="cerrarModal()"
  type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
    Cerrar
  </button>

  <button
  (click)="save()" 
  type="button" class="btn btn-primary btn-sm">
    Guardar
  </button>
</div>
