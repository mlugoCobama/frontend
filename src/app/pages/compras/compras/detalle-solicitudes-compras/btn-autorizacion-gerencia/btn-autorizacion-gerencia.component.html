<div class="card border rounded-4 shadow-lg" *ngIf="solicitudCompra.auto_gg === 0 || solicitudCompra.auto_admin === 0 || (solicitudCompra.auto_macro === 0 && solicitudCompra.tipo == 2)">
  <div class="card-header rounded-4 bg-primary text-white fw-semibold text-center">
    <strong> Da click en tu botón para autorizar la solicitud y continuar con el proceso </strong>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="d-flex justify-content-evenly gap-2 col-9 mx-auto">
        <button [disabled] = "working" *ngIf="solicitudCompra.auto_gg === 0 && tienePermiso('view btn autorizacion gg') && validarEmpresaUsuario()"
          class="btn btn-primary rounded-4 fw-semibold col-md-4" type="button" (click)="autorizar('auto_gg')">
          <ng-container *ngIf="!working; else spinner">
            Autoriza: Gerencia general
          </ng-container>
        </button>
        <button [disabled] = "working" *ngIf="solicitudCompra.auto_admin === 0 && tienePermiso('view btn autorizacion ga') && validarEmpresaUsuario()"
          class="btn btn-info rounded-4 fw-semibold col-md-4" type="button" (click)="autorizar('auto_admin')">
          <ng-container *ngIf="!working; else spinner">
            Autoriza: Gerencia administrativa
          </ng-container>
        </button>

        <button [disabled] = "working" *ngIf="solicitudCompra.auto_admin === 0 && tienePermiso('view btn autorizacion go') && validarEmpresaUsuario()"
          class="btn btn-info rounded-4 fw-semibold col-md-4" type="button" (click)="autorizar('auto_admin')">
          <ng-container *ngIf="!working; else spinner">
            Autoriza: Gerencia operativa
          </ng-container>
        </button>

        <button
        [disabled] = "working"
          *ngIf="solicitudCompra.auto_macro === 0  && solicitudCompra.auto_gg === 1 && solicitudCompra.auto_admin === 1 && tienePermiso('view btn autorizacion macro') && solicitudCompra.tipo === 2"
          class="btn btn-warning rounded-4 fw-semibold col-md-4" type="button" (click)="guardar('auto_macro')">
          <ng-container *ngIf="!working; else spinner">
            Autoriza: Macro taller
          </ng-container>
        </button>
      </div>
    </div>
  </div>
</div>
<ng-template #spinner>
    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <strong> Trabajando... </strong>
</ng-template>
