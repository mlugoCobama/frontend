<!-- botones aceptar o rechazar orden -->
<div *ngIf = "isLoad" class="row justify-content-around">
    <button
      class="btn btn-danger col-md-5"
      (click)="cancelarOrden()"
    >
      Orden de compra rechazada
    </button>
    <button
      class="btn btn-success col-md-5"
      (click)="autorizarOrden()"
    >
      Orden de compra autorizada
    </button>
</div>
