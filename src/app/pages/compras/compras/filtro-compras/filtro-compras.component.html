  <div class="card-body"> -->

    <div class="row g-3 m-0">


      <!-- EMPRESA -->
      <div class="col-md-3 m-0">
        <label class="form-label fw-semibold small">
          Empresa
        </label>
        <select
        *ngIf="viewSelectEmpresas ;else nombreEmpresa"
          class="form-select form-select-sm"
          [(ngModel)]="filtros.empresa"
          (ngModelChange)="seleccionarFiltro()">
          <option [ngValue]="''" disabled>
            Selecciona una empresa
          </option>
          <option [ngValue]="null" *ngIf="viewOptionAll">
            Todas las empresas
          </option>
          <ng-container *ngFor="let empresa of empresas">
            <option
            *ngIf="tienePermiso(empresa.permiso)"
              [ngValue]="empresa.name">
              {{ empresa.name }}
            </option>
          </ng-container>

        </select>
      </div>

      <!-- AÑO -->
      <div class="col-md-2 m-0">
        <label class="form-label fw-semibold small">
          Año
        </label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="filtros.anio"
          (ngModelChange)="seleccionarFiltro()">

          <!-- <option [ngValue]="null">
            Todos
          </option> -->
          <option
            *ngFor="let anio of anios"
            [ngValue]="anio">
            {{ anio }}
          </option>
        </select>
      </div>

      <!-- MES -->
      <div class="col-md-2 m-0 ">
        <label class="form-label fw-semibold small">
          Mes
        </label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="filtros.mes"
          (ngModelChange)="seleccionarFiltro()">
          <!-- <option [ngValue]="null">
            Todos
          </option> -->
          <option
            *ngFor="let mes of meses"
            [ngValue]="mes.valor">
            {{ mes.nombre }}
          </option>
        </select>
      </div>

      <!-- PROVEEDOR -->
      <div class="col-md-3 m-0" *ngIf="viewSelectProveedores">
        <label class="form-label fw-semibold small">
          Proveedor
        </label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="filtros.proveedor"
          (ngModelChange)="seleccionarFiltro()">
          <option [ngValue]="null">
            Todas los proveedores
          </option>
          <option
            *ngFor="let proveedor of proveedores"
            [ngValue]="proveedor">
            {{ proveedor }}
          </option>
        </select>
      </div>



      <!-- TIPO -->
      <div class="col-md-2 m-0  d-flex gap-2">
        <button
          type="button"
          class="btn btn-outline-info btn-sm mt-4"
          (click)="recargar()">
          <i class="fas fa-undo"></i>
        </button>

        <!-- <button
        type="button"
        class="btn btn-outline-secondary btn-sm mt-4"
        (click)="limpiarFiltros()">
        <i class="fas fa-eraser"></i>
      </button> -->

      </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
    </div>
  <!-- </div>
</div> -->
<ng-template #nombreEmpresa>
  <p class="mb-0 py-1">
    <strong>{{ empresaSeleccionada || 'Espera...' }} </strong>
  </p>
</ng-template>
