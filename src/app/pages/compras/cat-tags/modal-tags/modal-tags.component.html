<div class="modal-header">
  <h5 class="modal-title" id="exampleModalLabel">
    {{ tipo | titlecase }} TAG
  </h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="cerrarModal()"></button>
</div>

<div class="modal-body">
<form [formGroup]="tagForm" class="row g-2">
    
    <div class="col-lg-12">
        <label class="form-label">Empresa</label>
        <select
            class="form-select form-select-sm"
            formControlName="intercompania">
            <option [value]="''"disabled selected> Selecciona una opción </option>
            <option *ngFor="let item of empresas" [value]="item.intercompania">
                {{ item.name.toUpperCase() }}
            </option>
        </select>
        <div *ngIf="f['intercompania'].touched && f['intercompania'].invalid"
            class="form-text text-danger">
            La empresa es obligatoria.
        </div>
    </div>

    <div class="col-lg-6">
        <label class="form-label">Marca TAG.</label>
        <select
            class="form-select form-select-sm"
            formControlName="proveedor">
            <option [value]="''"disabled selected> Selecciona una opción </option>
            <option *ngFor="let item of marcasTag" [value]="item.marca">
                {{ item.label }}
            </option>
        </select>
        <div *ngIf="f['proveedor'].touched && f['proveedor'].invalid"
            class="form-text text-danger">
            La marca del tag es obligatoria.
        </div>
    </div>

    <div class="col-lg-6">
        <label class="form-label">Número de TAG</label>
        <input
            type="text"
            class="form-control form-control-sm"
            placeholder="Número de TAG"
            formControlName="num_tag">

        <div *ngIf="f['num_tag'].touched && f['num_tag'].invalid"
            class="form-text text-danger">
            El número de TAG es obligatorio.
        </div>
    </div>
    <div class="col-lg-6">
        <label class="form-label">Clave</label>
        <input
            type="text"
            class="form-control form-control-sm"
            placeholder="Clave"
            formControlName="serie">

        <div *ngIf="f['serie'].touched && f['serie'].invalid"
            class="form-text text-danger">
            La clave es obligatoria.
        </div>
    </div>

    <div class="col-lg-6">
        <label class="form-label">Estatus</label>
        <select
            class="form-select form-select-sm"
            formControlName="estatus">
            <option value="">Seleccione un estatus</option>
            <option value="1">Activo</option>
            <option value="2">Inactivo</option>
            <option value="3">Vencido</option>
            <option value="4">Suspendido</option>
        </select>

        <div *ngIf="f['estatus'].touched && f['estatus'].invalid"
            class="form-text text-danger">
            El estatus es obligatorio.
        </div>
    </div>
    <div class="col-lg-12">
        <label class="form-label">Observaciones</label>
        <textarea
            rows="3"
            class="form-control form-control-sm"
            placeholder="Observaciones"
            formControlName="observaciones">
        </textarea>
    </div>

</form>
</div>

<div class="modal-footer">
  <button
   [disabled]="sending"
    type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" (click)="cerrarModal()"
  >
    Cerrar
  </button>
  <button 
  [disabled]="sending"
  type="button" class="btn btn-primary btn-sm" (click)="save()">
  <i class="fas fa-save " [ngClass]="{ 'bx-fade-right': sending }" ></i>
    {{ sending ? 'Guardando' :'Guardar'}}
  </button>
</div>
