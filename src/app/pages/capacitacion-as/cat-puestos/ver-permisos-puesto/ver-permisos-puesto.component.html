<div class="modal-header">
  <h5 class="modal-title" id="exampleModalLabel">
    Puesto: {{nombrePuesto}}
  </h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal" (click)="cerrarModal()"></button>
</div>
  <div class="modal-body">
    <div class="d-flex justify-content-center" *ngIf="isLoad">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
    </div>
    <div class="overflow-auto" style="max-height: 300px;" *ngIf="!isLoad">
        <ul class="list-group">
        <li *ngFor = "let item of data" class="list-group-item" [ngClass]="{'active': esUnaPalabra(item.permiso)}">{{item.permiso}}</li>
    </ul>
</div>
  </div>
<div class="modal-footer">
  <button
  type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" (click)="cerrarModal()">
    Cerrar
  </button>
</div>
