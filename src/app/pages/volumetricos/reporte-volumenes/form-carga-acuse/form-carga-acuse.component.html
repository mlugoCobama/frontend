<div class="card rounded-4 shadow-sm">

  <div class="card-header rounded-4 bg-primary text-white fw-semibold">
    <i class="fas fa-file-alt me-1"></i>
    Carga tu acuse de {{ tipo }}
  </div>

  <div class="card-body">
    <form (ngSubmit)="guardarAcuse()">
      <div class="mb-3" *ngIf="requiereTipoAcuse">
        <label
          for="tipoAcuse" class="form-label">
          Tipo de acuse:
        </label>
        <select
          id="tipoAcuse" name="tipoAcuse" class="form-select form-select-sm" [(ngModel)]="tipoAcuse" [disabled]="guardando">
          <option value="">Selecciona una opción</option>
          <option value="aceptacion">Aceptación</option>
          <option value="rechazo">Rechazo</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="acuse" class="form-label"> Acuse: </label>
        <input
          type="file"
          class="form-control form-control-sm"
          id="acuse"
          name="acuse"
          accept="application/pdf"
          [disabled]="guardando"
          (change)="seleccionarArchivo($event)"
        >
        <small class="text-muted">
          Solo se permiten archivos PDF.
        </small>
      </div>

      <div
        *ngIf="archivo"
        class="alert alert-light border
               d-flex align-items-center">
        <i class="fas fa-file-pdf text-danger fs-4 me-2"></i>
        <div>
          <strong>
            {{ archivo.name }}
          </strong>
          <div class="small text-muted">
            {{ archivo.size / 1024 | number:'1.0-2' }} KB
          </div>
        </div>
      </div>

      <div
        class="d-flex align-items-center justify-content-end">
        <button
          type="submit"
          class="btn btn-primary btn-sm"
          [disabled]="guardando || !archivo">
          <span
            *ngIf="guardando"
            class="spinner-border spinner-border-sm me-1"
            role="status"
            aria-hidden="true">
          </span>
          <i
            *ngIf="!guardando"
            class="fas fa-save me-1">
          </i>
          {{ guardando ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
</div>
