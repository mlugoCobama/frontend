<div class="row">
    <app-header-planta
    [descripcionInstalacion] = "dataJson?.DescripcionInstalacion"
    [numPermiso] = "dataJson?.NumPermiso"
    [versionJson] = "dataJson?.Version"
    [fechaReporte] = "dataJson?.FechaYHoraReporteMes  || 0"
    ></app-header-planta>
</div>

<div class="row">
    <div class=" col-12 col-xl-12 ">
        <app-kpi-card
         [color] = "'text-warning'"
         [icono] = "'fas fa-boxes'"
         [titulo]= "' Existencias en Mes'"
         [sufijo]= "' L'"
         [valor]= "+existencias?.VolumenExistenciasMes  || 0"
        ></app-kpi-card>
    </div>

    <div class="col-xl-4 col-12">
        <div class="row">
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-success'"
                [icono] = "'fas fa-sign-out-alt '"
                [titulo]= "' TOTAL RECEPCIONES'"
                [note]= "'docs'"
                [valor]= "+recepciones?.TotalDocumentosMes || 0"
                ></app-kpi-card>
            </div>
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-danger'"
                [icono] = "'fas fa-sign-out-alt '"
                [titulo]= "' TOTAL ENTREGAS'"
                [note]= "'docs'"
                [valor]= "+entregas?.TotalDocumentosMes || 0"
                ></app-kpi-card>
            </div>


        </div>
    </div>
    <div class="col-xl-4 col-12">
         <div class="row">
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-success'"
                [icono] = "'fas fa-arrow-alt-circle-down '"
                [titulo]= "' VOLUMENES RECIBIDOS'"
                [sufijo]= "' L'"
                [valor]= "+recepciones?.SumaVolumenRecepcionMes?.ValorNumerico || 0"
                ></app-kpi-card>
            </div>
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-danger'"
                [icono] = "'fas fa-arrow-alt-circle-up'"
                [titulo]= "' VOLUMENES ENTREGADOS'"
                [sufijo]= "' L'"
                [valor]= "+entregas?.SumaVolumenEntregadoMes?.ValorNumerico || 0"
                ></app-kpi-card>
            </div>
        </div>
    </div>
    <div class="col-xl-4 col-12">
        <div class="row">
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-success'"
                [icono] = "'fas fa-money-bill-wave'"
                [titulo]= "'  Importe Recepciones'"
                [prefijo]= "'$'"
                [valor]= "+recepciones?.ImporteTotalRecepcionesMensual"
                ></app-kpi-card>
            </div>
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-danger'"
                [icono] = "'fas fa-money-bill-wave'"
                [titulo]= "' Importe Entregas'"
                [prefijo]= "'$'"
                [valor]= "+entregas?.ImporteTotalEntregasMes"
                ></app-kpi-card>
            </div>
        </div>
    </div>
    <div class="col-xl-6 col-12">
       <app-card-aclaraciones
          [title]="'Recepciones'"
          [volumenSinCfdi] = "aclaracionesRecepciones.sinCfdi"
          [volumenTraspaso] =  "aclaracionesRecepciones.autoconsumo"
          [volumenAutoconsumo] = "aclaracionesRecepciones.traspaso"
       >
       </app-card-aclaraciones>
    </div>
    <div class="col-xl-6 col-12">
       <app-card-aclaraciones
          [title]="'Entregas'"
          [volumenSinCfdi] = "aclaracionesEntregas.sinCfdi"
          [volumenTraspaso] =  "aclaracionesEntregas.autoconsumo"
          [volumenAutoconsumo] = "aclaracionesEntregas.traspaso"
       >
       </app-card-aclaraciones>
    </div>
</div>

<div class="row">

    <app-tabs-resumenes
    [data] = "dataJson"
    ></app-tabs-resumenes>
</div>
