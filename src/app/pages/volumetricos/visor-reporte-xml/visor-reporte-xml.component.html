<div class="d-flex justify-content-end py-2">
    <button type="button" class="btn btn-info btn-sm  fw-semibold" (click)="descargarPdf()" >
          <ng-container>
            <i class="fas fa-print me-1 "></i> Descargar PDF
          </ng-container>
        </button>
</div>

<div class="row">
    <app-header-planta
    [descripcionInstalacion] = "dataJson?.DescripcionInstalacion"
    [numPermiso] = "dataJson?.NumPermiso"
    [versionJson] = "dataJson?.Version"
    [fechaReporte] = "dataJson?.FechaYHoraReporteMes  || 0"
    ></app-header-planta>
</div>

<div class="row">
    <div class=" col-12 col-xl-12 ">
        <app-kpi-card
         [color] = "'text-warning'"
         [icono] = "'fas fa-boxes'"
         [titulo]= "' Existencias en Mes'"
         [sufijo]= "' L'"
         [valor]= "+existencias?.VolumenExistenciasMes  || 0"
        ></app-kpi-card>
    </div>

    <div class="col-xl-4 col-12">
        <div class="row">
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-success'"
                [icono] = "'fas fa-sign-out-alt '"
                [titulo]= "' TOTAL RECEPCIONES'"
                [note]= " (+recepciones?.TotalDocumentosMes || 0) + ' docs'"
                [valor]= "+recepciones?.TotalRecepcionesMes || 0"
                ></app-kpi-card>
            </div>
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-danger'"
                [icono] = "'fas fa-sign-out-alt '"
                [titulo]= "' TOTAL ENTREGAS'"
                [note]= " (+entregas?.TotalDocumentosMes || 0) + ' docs'"
                [valor]= "+entregas?.TotalEntregasMes || 0"
                ></app-kpi-card>
            </div>
        </div>
    </div>
    <div class="col-xl-4 col-12">
         <div class="row">
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-success'"
                [icono] = "'fas fa-arrow-alt-circle-down '"
                [titulo]= "' VOLUMENES RECIBIDOS'"
                [sufijo]= "' L'"
                [valor]= "+recepciones?.SumaVolumenRecepcionMes?.ValorNumerico || 0"
                ></app-kpi-card>
            </div>
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-danger'"
                [icono] = "'fas fa-arrow-alt-circle-up'"
                [titulo]= "' VOLUMENES ENTREGADOS'"
                [sufijo]= "' L'"
                [valor]= "+entregas?.SumaVolumenEntregadoMes?.ValorNumerico || 0"
                ></app-kpi-card>
            </div>
        </div>
    </div>
    <div class="col-xl-4 col-12">
        <div class="row">
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-success'"
                [icono] = "'fas fa-money-bill-wave'"
                [titulo]= "'  Importe Recepciones'"
                [prefijo]= "'$'"
                [valor]= "+recepciones?.ImporteTotalRecepcionesMensual || 0"
                ></app-kpi-card>
            </div>
            <div class="col-xl-12 col-6">
                <app-kpi-card
                [color] = "'text-danger'"
                [icono] = "'fas fa-money-bill-wave'"
                [titulo]= "' Importe Entregas'"
                [prefijo]= "'$'"
                [valor]= "+entregas?.ImporteTotalEntregasMes || 0"
                ></app-kpi-card>
            </div>
        </div>
    </div>
    <div class="col-xl-6 col-12">
       <app-card-aclaraciones
          [title]="'Recepciones'"
          [volumenSinCfdi] = "aclaracionesRecepciones?.sinCfdi || 0"
          [volumenTraspaso] =  "aclaracionesRecepciones?.autoconsumo  || 0"
          [volumenAutoconsumo] = "aclaracionesRecepciones?.traspaso || 0"
       >
       </app-card-aclaraciones>
    </div>
    <div class="col-xl-6 col-12">
       <app-card-aclaraciones
          [title]="'Entregas'"
          [volumenSinCfdi] = "aclaracionesEntregas?.sinCfdi || 0"
          [volumenTraspaso] =  "aclaracionesEntregas?.autoconsumo || 0"
          [volumenAutoconsumo] = "aclaracionesEntregas?.traspaso || 0"
       >
       </app-card-aclaraciones>
    </div>
</div>

<div class="row">
    <app-tab-resumenes-xml
    [data] = "dataJson"
    ></app-tab-resumenes-xml>
</div>
