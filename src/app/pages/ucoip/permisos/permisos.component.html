
<div class="card shadow-lg">
    <div class="card-body">
        <h5>Gestión de Permisos</h5>
    </div>
</div>

  <div class="card ">
    <div class="card-body">
      <!-- Campo de búsqueda -->
      <form (ngSubmit)="buscarPermisos()" class="mb-3">
        <div class="input-group">
          <input type="email"
                 class="form-control form-control-sm"
                 placeholder="Correo del usuario"
                 [(ngModel)]="correo"
                 name="correo">
          <button class="btn btn-primary btn-sm" type="submit">Buscar</button>
        </div>
      </form>

      <div *ngIf="loading" class="text-center my-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

      <!-- Lista de permisos -->
      <div class="row" *ngIf="permisos.length > 0">
        <div *ngFor="let modulo of permisos" class="mb-3 col-lg-6">
          <p class="border-start border-bottom border-seconday"> 
            <i class="fas fa-toolbox">
            </i> <strong> {{ modulo.nombre }} - {{ usuarioConsultado }} </strong></p>
          <div class="form-check form-switch  py-1 border-start border-bottom border-seconday" *ngFor="let permiso of modulo.permisos">
            <!-- <i class="m-e fas" [ngClass]="permiso.activo ? 'text-success fa-lock-open' : 'text-secondary fa-lock'" ></i> -->
            <input class="form-check-input ms-1"
                   type="checkbox"
                   [(ngModel)]="permiso.activo"
                   [ngClass]="permiso.activo ? 'bg-success border-success' : ''"
                   [name]="'permiso_' + permiso.id">
            <label class="form-check-label">
              {{ permiso.descripcion | titlecase }}<small class="text-muted"><em>-{{ permiso.nombre }}</em></small>
            </label>
          </div>
        </div>
      </div>

      <!-- Botón de guardar solo si hay idUsuario -->
      <div class="mt-3 d-flex justify-content-end" *ngIf="idUsuario">
        <button class="btn btn-success btn-sm" (click)="guardarPermisos()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            Guardar
        </button>
      </div>
    </div>
  </div>
