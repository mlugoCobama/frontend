<div [formGroup]="group">
    <div class="card rounded-4 shadow-sm">
        <div class="card-header rounded-4 fw-bold">Checklist preventivo</div>
        <div class="card-body">
            <div class="text-muted small" *ngIf="loading">Cargando checklist...</div>

            <div class="row" *ngIf="!loading">
                <div class="col-md-4" *ngFor="let item of items">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" [formControlName]="item.codigo_control">
                        <label class="form-check-label">{{ item.etiqueta }}</label>
                    </div>
                </div>

                <div class="text-muted small" *ngIf="!items.length">
                    No hay ítems de checklist configurados para preventivo.
                </div>
            </div>
        </div>
    </div>
</div>
