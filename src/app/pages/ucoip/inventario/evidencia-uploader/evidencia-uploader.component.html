<label class="form-label small">{{ label }}</label>
<input type="file" class="form-control form-control-sm" multiple accept="image/*" (change)="onFileSelected($event)">

<div *ngIf="files.length > 0" class="row m-1 border border-2 rounded-4" [ngClass]="bordeContainer">
    <div class="col-4 mb-2" *ngFor="let img of files">
        <img [src]="preview(img)" class="img-thumbnail w-100">
    </div>
</div>
