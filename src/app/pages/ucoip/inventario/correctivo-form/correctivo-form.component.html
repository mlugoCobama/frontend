<div [formGroup]="group">
    <div class="card rounded-4  shadow-sm">
        <div class="card-header rounded-4 fw-bold">Correctivo</div>
        <div class="card-body">
            <label>Falla</label>
            <textarea rows="2" class="form-control form-control-sm" formControlName="falla"></textarea>
            <label class="mt-2">Diagnóstico</label>
            <textarea rows="2" class="form-control form-control-sm" formControlName="diagnostico"></textarea>

            <div class="row mt-2">
                <div class="col-md-3" *ngFor="let item of correctivoChecklist">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" [formControlName]="item.control">
                        <label class="form-check-label">{{ item.label }}</label>
                    </div>
                </div>
            </div>

            <hr>
            <button type="button" class="btn btn-sm btn-primary" (click)="agregarPieza()">
                Agregar pieza
            </button>

            <div formArrayName="piezas" class="mt-3">
                <div *ngFor="let pieza of piezas.controls; let i = index" [formGroupName]="i"
                    class="border rounded p-2 mb-2">
                    <div class="row g-2">
                        <div class="col">
                            <input class="form-control form-control-sm" formControlName="pieza" placeholder="Pieza">
                        </div>
                        <div class="col">
                            <input class="form-control form-control-sm" formControlName="anterior" placeholder="Anterior">
                        </div>
                        <div class="col">
                            <input class="form-control form-control-sm" formControlName="nueva" placeholder="Nueva">
                        </div>
                        <div class="col">
                            <input class="form-control form-control-sm" formControlName="serie" placeholder="Serie">
                        </div>
                        <div class="col">
                            <input class="form-control form-control-sm" formControlName="observacion" placeholder="Observación">
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-danger btn-sm" (click)="eliminarPieza(i)">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <label>Comentarios</label>
            <textarea rows="3" class="form-control form-control-sm" formControlName="comentarios"></textarea>
            <label class="mt-2">Observaciones</label>
            <textarea rows="3" class="form-control form-control-sm" formControlName="observaciones"></textarea>
        </div>
    </div>
</div>
