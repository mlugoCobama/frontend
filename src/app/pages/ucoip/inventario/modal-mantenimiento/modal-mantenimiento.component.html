<form [formGroup]="form">
    <div class="modal-header">
        <h5 class="modal-title">Reporte de mantenimiento</h5>
        <button type="button" class="btn-close" (click)="cerrarModal()"></button>
    </div>
    <div class="modal-body">
        <div class="row g-2">
          <div class="alert alert-light border mb-3 py-2">
            <small>
                <span class="text-danger fw-bold">*</span>
                Campos obligatorios.
            </small>
        </div>
            <div class="col-md-12">
                <label for="realizado_por" class="form-label small">Realizado por: *</label>
                <select id="realizado_por" formControlName="realizado_por" class="form-select form-select-sm">
                    <option value="" selected disabled>Selecciona una opción</option>
                    <option *ngFor="let t of tecnicos" [value]="t.id">
                    {{ t.firstname }} {{ t.realname }} - {{t.puesto}}
                    </option>
                </select>
                <div
                    class="small text-danger"
                    *ngIf="form.get('realizado_por')?.invalid && form.get('realizado_por')?.touched">
                      Debe seleccionar un técnico.
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label small">Tipo: *</label>
                <select class="form-select form-select-sm" formControlName="tipo">
                    <option value="1">Preventivo</option>
                    <option value="2">Correctivo</option>
                </select>
                <div
                    class="small text-danger"
                    *ngIf="form.get('tipo')?.invalid && form.get('tipo')?.touched">
                      Debe seleccionar un tipo de mantenimiento
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label small">Fecha</label>
                <input type="date" class="form-control form-control-sm" formControlName="fecha">
                <div
                    class="small text-danger"
                    *ngIf="form.get('fecha')?.invalid && form.get('fecha')?.touched">
                      Debes asignar una fecha de mantenimiento
                </div>
            </div>
        </div>
        <!-- PREVENTIVO -->
        <app-preventivo-form
            *ngIf="form.get('tipo')?.value === '1'"
             [group]="checklistFormGroup"
              [items]="checklistPreventivo"
              [loading]="loadingChecklist"
            class="d-block mt-3">
        </app-preventivo-form>

        <!-- CORRECTIVO -->
        <app-correctivo-form
            *ngIf="form.get('tipo')?.value === '2'"
            [group]="form"
            [checklistGroup]="checklistFormGroup"
            [items]="checklistCorrectivo"
            [loading]="loadingChecklist"
            class="d-block mt-3">
        </app-correctivo-form>
        <div class="mt-3">
            <label>Comentarios</label>
            <textarea rows="2" class="form-control form-control-sm" formControlName="comentarios"></textarea>
            <label class="mt-2">Observaciones</label>
            <textarea rows="2" class="form-control form-control-sm" formControlName="observaciones"></textarea>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <app-evidencia-uploader
                    label="Evidencia antes"
                    bordeContainer="border-warning bg-warning-subtle"
                    (filesChange)="onEvidenciaAntes($event)">
                </app-evidencia-uploader>
            </div>
            <div class="col-md-6">
                <app-evidencia-uploader
                    label="Evidencia después"
                    bordeContainer="border-success bg-success-subtle"
                    (filesChange)="onEvidenciaDespues($event)">
                </app-evidencia-uploader>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" (click)="cerrarModal()">
            Cerrar
        </button>
        <button type="button" class="btn btn-primary btn-sm"
            (click)="tipo === 'agregar' ? save() : update()">
            Guardar
        </button>
    </div>
</form>
