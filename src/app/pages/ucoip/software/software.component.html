<div class="container-fluid">
    <div class="row">
        <div class="col-xl-12">
            <div class="card shadow-sm rounded-4">
                <div class="card-body border-bottom border-primary border-2 rounded-4">
                    <div class="d-flex align-items-center">
                        <h5 class="mb-0 card-title flex-grow-1">Inventario de Licencias de Software</h5>

                        <div class="d-flex flex-shrink-0 gap-2">
                             <button
                                *ngIf="itemSeleccionado"
                                class="btn btn-danger btn-sm"
                                (click)="confirmarEliminacion(itemSeleccionado?.id)">
                                <i class="fas fa-trash me-1"></i>
                                Eliminar
                            </button>
                            <a class="btn btn-primary btn-sm" (click)="openModalNuevo()"><i class="fas fa-plus"></i> Nuevo</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card rounded-4 shadow-sm">
    <div class="card-body">
        <div *ngIf="isLoad" class="text-center py-3">
            <div class="spinner-border  text-secondary" role="status"></div>
        </div>
        <app-datatable-generico
        *ngIf="dataInventario.length > 0"
        [data]="dataInventario"
        [isLoad]="isLoad"
        [columnas]="columnas"
        [filtros]="filtros"
        (rowClick)="setItemSeleccionado($event)"
        (rowDoubleClick)="openEdit($event)">
        </app-datatable-generico>
    </div>
</div>
