<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm rounded-4">
                <div class="card-body border-bottom border-primary border-2 rounded-4 ">
                    <div class="d-flex align-items-center">
                        <h5 class="mb-0 card-title flex-grow-1">
                            Tokens de Agencias
                        </h5>
                        <div class="d-flex flex-shrink-0 gap-2">
                            <button
                            *ngIf="itemSeleccionado"
                                class="btn btn-danger btn-sm"
                                (click)="confirmarEliminacion(itemSeleccionado?.id)">
                                <i class="fas fa-trash me-1"></i>
                                Eliminar
                            </button>

                            <button
                                class="btn btn-primary btn-sm"
                                (click)="openModalNuevo()">
                                <i class="fas fa-plus me-1"></i>
                                Nuevo
                            </button>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card rounded-4 shadow-sm">

    <div class="card-body">

        <div
            *ngIf="isLoad"
            class="text-center py-5">

            <div
                class="spinner-border text-primary"
                role="status">

            </div>

        </div>

        <app-datatable-generico

            *ngIf="!isLoad"

            [data]="dataTokens"

            [columnas]="columnas"

            [filtros]="filtros"

            [isLoad]="isLoad"

            (rowClick)="setItemSeleccionado($event)"

            (rowDoubleClick)="openEdit($event)">

        </app-datatable-generico>

    </div>

</div>
